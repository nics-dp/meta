[settings]
jobs = 16
task.output = "keep-order"

# ------------------------------------------------------------------------------
# Tools needed by mise tasks are declared inline via `#MISE tools={...}` in each
# task file under `.mise/tasks/`. Only project-level tools (not consumed by any
# task) belong here.
[tools]
act = "latest"

# ------------------------------------------------------------------------------
[task_config]
includes = [
  ".mise/tasks",
]

# ==============================================================================
#  CI Tasks
# ==============================================================================
[tasks.ci]
description = "Run all CI checks"
depends = [
  "iac:trivy",
  "ci:meta-semgrep",
]

# Meta-only age policy; consumers keep the shared ci:semgrep defaults.
[tasks."ci:meta-semgrep"]
description = "OpenGrep p/ci with meta's Renovate release-age policy"
hide = true
tools = { "aqua:opengrep/opengrep" = "1.30.0" }
run = """
opengrep scan --error --enable-nosem --config p/ci \
  --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age \
  --config .opengrep/renovate.yml .
"""

# Full validation gate. Entry point for the auto-release driver (`mise run all`)
# so meta can dogfood its own reusable release workflow. Config repo has no
# build/test — validation covers the mise graph, task shell, workflow YAML, and
# high-severity Zizmor findings plus the ci scans. All steps are read-only (no
# working-tree drift), so they run in parallel. Secret/license scans
# (betterleaks/trufflehog/trivy-license) are run separately by the driver itself,
# so they are not duplicated here.
[tasks.all]
description = "Validation gate: task/workflow definitions + ci scans (auto-release driver entry point)"
depends = ["mise:validate", "iac:actionlint", "iac:shellcheck", "iac:zizmor", "ci"]

# ==============================================================================
#  SBOM Tasks
# ==============================================================================
[tasks.sbom]
description = "Run full SBOM pipeline (generate, enrich, scan)"
depends = ["sbom:trivy", "sbom:grype"]
