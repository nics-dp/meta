[settings]
jobs = 16
task.output = "keep-order"
unix_default_inline_shell_args = "bash -c"

# ------------------------------------------------------------------------------
[tools]
# GitHub action tools
act = "latest"
actionlint = "latest"

# SBOM generation
syft = "latest"
"github:snyk/parlay" = "latest"

# Deps vuln scanning
trivy = "latest"
grype = "latest"

# Static scanning
"pipx:semgrep" = "latest"

# MISC
bun = "latest"

# ------------------------------------------------------------------------------
[task_config]
includes = [
  ".mise/tasks",
]

# ==============================================================================
#  CI Tasks
# ==============================================================================
[tasks.ci]
description = "Run all CI checks"
depends = [
  "iac:trivy",
  "ci:trivy-license",
  "ci:semgrep",
]

# ==============================================================================
#  SBOM Tasks
# ==============================================================================
[tasks.sbom]
description = "Run full SBOM pipeline (generate, enrich, scan)"
depends = ["sbom:trivy", "sbom:grype"]
