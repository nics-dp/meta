[settings]
jobs = 16
task.output = "keep-order"
unix_default_inline_shell_args = "bash -c"

# ------------------------------------------------------------------------------
# Tools needed by mise tasks are declared inline via `#MISE tools={...}` in each
# task file under `.mise/tasks/`. Only project-level tools (not consumed by any
# task) belong here.
[tools]
act = "latest"

# ------------------------------------------------------------------------------
[task_config]
includes = [
  ".mise/tasks",
]

# ==============================================================================
#  CI Tasks
# ==============================================================================
[tasks.ci]
description = "Run all CI checks"
depends = [
  "iac:trivy",
  "ci:trivy-license",
  "ci:semgrep",
]

# ==============================================================================
#  SBOM Tasks
# ==============================================================================
[tasks.sbom]
description = "Run full SBOM pipeline (generate, enrich, scan)"
depends = ["sbom:trivy", "sbom:grype"]
