# Frontend (JS/TS via bun) facade.

[settings]
jobs = 16
task.output = "keep-order"

# ------------------------------------------------------------------------------
[tools]
# JS/TS runtime
bun = "latest"

[env]
# Override meta config base if forking nics-dp/meta
# META_CONFIG_BASE = "https://raw.githubusercontent.com/your-org/meta/main/configs"

# Playwright env (consumed by configs/playwright.config.ts):
# PW_BASE_URL    = "http://localhost:5173"
# PW_DEV_CMD     = "bun run dev"
# PW_TEST_DIR    = "./e2e"
# PW_NO_SERVER   = "1"   # set if dev server already running

# Bundle size scan target (default: dist)
# BUNDLE_SIZE_DIR = "dist"

# ------------------------------------------------------------------------------
[task_config]
includes = ["git::https://github.com/nics-dp/meta.git//.mise/tasks?ref=main"]

# ==============================================================================
# Facade tasks
# ==============================================================================
[tasks.init]
silent = "stdout"
description = "Install JS deps + Playwright browsers"
depends = ["node:install", "node:e2e-install"]
depends_post = ["meta:bump"]

[tasks.clean]
silent = "stdout"
description = "Wipe Node artifacts"
depends = ["node:clean"]

[tasks.build]
silent = "stdout"
description = "Build frontend bundle"
depends = ["node:build"]

[tasks.run]
description = "Run a bun script (default: dev)"
depends = ["node:run"]

[tasks.test]
description = "Run frontend unit tests"
depends = ["node:test"]

[tasks.bench]
description = "Run vitest benchmarks (single pass)"
run = "bunx vitest bench --run"

[tasks.update]
silent = "stdout"
description = "Bump deps and refresh shared atoms"
# meta:bump runs first in its OWN invocation (run array steps are separate
# `mise run` processes): it refreshes the shared atom cache, then the deps
# step re-resolves and runs against the latest upstream atoms. Separate
# invocations also avoid the cache-clear race that depends/depends_post had.
run = ["mise run meta:bump", "mise run node:update"]
[tasks.ci]
description = "Run all CI checks"
# Native-binary toolchain (oxc/opengrep/tsgo): oxfmt replaces prettier; oxlint &
# typecheck-tsgo run as fast shadows ALONGSIDE eslint/vue-tsc (which stay
# authoritative for .vue templates / SFC internals). node:sast (njsscan) dropped
# — it targets Express backends, N/A to a Vue SPA; ci:semgrep (engine now
# OpenGrep) already covers frontend xss/eval.
depends = [
  "node:lint-fix",
  "node:oxlint",
  "node:oxfmt-fix",
  "node:typecheck",
  "node:typecheck-tsgo",
  "node:knip",
  "node:audit",
  # "node:deptree",
  "node:bundle-size",
  "node:e2e",
  "node:lighthouse",
  "ci:semgrep typescript javascript",
  "iac:trivy",
]


[tasks.release-check]
description = "Read-only validation for all/release driver (ci minus file-mutating *-fix atoms)"
depends = [
  "node:lint-check",
  "node:oxlint",
  "node:oxfmt-check",
  "node:typecheck",
  "node:typecheck-tsgo",
  "node:knip",
  "node:audit",
  "node:bundle-size",
  "node:e2e",
  "node:lighthouse",
  "ci:semgrep typescript javascript",
  "iac:trivy",
]

[tasks.sbom]
description = "Generate enriched SBOM and scan"
depends = ["sbom:trivy", "sbom:grype"]

[tasks.all]
description = "init first, then build/test/release-check in parallel"
run = ["mise run init", "mise run build ::: test ::: release-check"]
