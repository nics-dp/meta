# Image-only facade (Dockerfile-only repos like patroni). No build/run/test.

[settings]
jobs = 16
task.output = "keep-order"
# mise reads the git:: entry in [task_config] includes only with experimental on;
# without it the shared meta tasks are skipped.
experimental = true

# ------------------------------------------------------------------------------
# All required tools are declared inline by the shared tasks under
# git::https://github.com/nics-dp/meta.git//.mise/tasks
[tools]

[env]
# Override meta config base if forking nics-dp/meta
# META_CONFIG_BASE = "https://raw.githubusercontent.com/your-org/meta/main/configs"

# ------------------------------------------------------------------------------
[task_config]
includes = ["git::https://github.com/nics-dp/meta.git//.mise/tasks?ref=main"]

# ==============================================================================
# Facade tasks
# ==============================================================================
[tasks.init]
silent = "stdout"
description = "No-op (no source deps)"
run = "true"

[tasks.clean]
silent = "stdout"
description = "Wipe Docker Compose state"
run = "docker compose down --volumes --rmi all --remove-orphans 2>/dev/null || true"

[tasks.ci]
description = "Run all CI checks"
depends = [
  "iac:img:hadolint",
  "iac:trivy",
  "ci:toolchain-pins",
]

[tasks.sbom]
description = "Generate enriched SBOM and scan"
depends = ["sbom:trivy", "sbom:grype"]

[tasks.update]
silent = "stdout"
description = "Refresh shared atoms"
depends = ["meta:bump"]

# ==============================================================================
# Doctor checks — `mise doctor project`
# ==============================================================================
# Read-only checks of what local development needs. mise rejects [doctor] in a
# config include, so each repo declares its checks here and each `run` calls a
# shared doctor:* atom. mise discards check output; run the atom directly
# (`mise run doctor:docker`) to see why a check fails.
[doctor.checks.docker]
description = "The Docker daemon answers"
run = "mise run --quiet doctor:docker"
hint = "Start the Docker daemon (Docker Desktop, OrbStack, Colima or the docker service)"

[doctor.checks.submodules]
description = "Git submodules are initialized"
run = "mise run --quiet doctor:submodules"
hint = "Run `mise run gs:clone`"
