# Python facade. Requires uv + ruff + pytest + coverage + bandit + pip-audit
# in pyproject.toml [dependency-groups].test (or equivalent).

[settings]
jobs = 16
task.output = "keep-order"

# ------------------------------------------------------------------------------
[tools]
# Python toolchain
python = "3.14.6"
uv = "latest"

[env]
# Override meta config base if forking nics-dp/meta
# META_CONFIG_BASE = "https://raw.githubusercontent.com/your-org/meta/main/configs"

# Override py-env defaults if needed:
# PY_RUNNER         = "uv run --group test"             # default
# PY_TEST_PATHS     = "tests"                           # auto-detect tests/ or .
# PY_LINT_PATHS     = "."                               # used by ruff/dead-code/complexity
#                                                       # (typecheck reads pyproject.toml instead)
# PY_BANDIT_PATHS   = "."
# PY_BANDIT_EXCLUDE = "./.venv,./tests,./test"
# PY_COVERAGE_FILE  = "coverage.xml"
#
# For typecheck excludes, configure in pyproject.toml:
#   [tool.ty.src]
#   exclude = ["test", ".venv"]
#   [tool.pyrefly]
#   project-excludes = ["test/**", ".venv/**"]

# ------------------------------------------------------------------------------
[task_config]
includes = ["git::https://github.com/nics-dp/meta.git//.mise/tasks?ref=main"]

# ==============================================================================
# Facade tasks
# ==============================================================================
[tasks.init]
silent = "stdout"
description = "Install Python deps"
depends = ["py:install"]
depends_post = ["meta:bump"]

[tasks.clean]
silent = "stdout"
description = "Wipe Python artifacts and caches"
depends = ["py:clean"]

[tasks.build]
silent = "stdout"
description = "Build wheel + sdist"
depends = ["py:build"]

[tasks.test]
description = "Run pytest with coverage and HTML report"
depends = ["py:test --coverage"]
depends_post = ["py:report"]

[tasks.run]
description = "Run a Python module or script"
usage = 'arg "<target>"'
depends = ["py:run {{usage.target}}"]

[tasks.bench]
description = "Run pytest benchmarks (single pass)"
depends = ["py:test --bench"]

[tasks.update]
silent = "stdout"
description = "Bump deps and refresh shared atoms"
# meta:bump runs first in its OWN invocation (run array steps are separate
# `mise run` processes): it refreshes the shared atom cache, then the deps
# step re-resolves and runs against the latest upstream atoms. Separate
# invocations also avoid the cache-clear race that depends/depends_post had.
run = ["mise run meta:bump", "mise run py:update"]
[tasks.ci]
description = "Run all CI checks"
depends = [
  "py:lint-fix",
  "py:format-fix",
  "py:typecheck",
  "py:typecheck --pyrefly",
  "py:sast",
  "py:audit",
  "py:safety-db",
  "py:complexity",
  "py:dead-code",
  # "py:deptree",
  "py:license-custom",
  "ci:semgrep python",
]


[tasks.release-check]
description = "Read-only validation for all/release driver (ci minus file-mutating *-fix atoms)"
depends = [
  "py:lint-check",
  "py:format-check",
  "py:typecheck",
  "py:typecheck --pyrefly",
  "py:sast",
  "py:audit",
  "py:safety-db",
  "py:complexity",
  "py:dead-code",
  "py:license-custom",
  "ci:semgrep python",
]

[tasks.sbom]
description = "Generate enriched SBOM, scan vulnerabilities, audit licenses"
depends = [
  "py:license-custom",
]

[tasks.all]
description = "init first, then build/test/release-check in parallel"
run = ["mise run init", "mise run build ::: test ::: release-check"]
