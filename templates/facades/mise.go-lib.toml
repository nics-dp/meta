# Go library facade — no build/run; library consumed by other repos.

[settings]
jobs = 16
task.output = "keep-order"
unix_default_inline_shell_args = "bash -c"

# ------------------------------------------------------------------------------
[tools]
# Go toolchain
go = "1.26.5"

[env]
# Override meta config base if forking nics-dp/meta
# META_CONFIG_BASE = "https://raw.githubusercontent.com/your-org/meta/main/configs"

# Go private modules
GOPRIVATE = "github.com/nics-dp"
GONOPROXY = "github.com/nics-dp"
GONOSUMDB = "github.com/nics-dp"

CGO_ENABLED = "1"  # required for race detector

# Optional: local-replace pairs for go:lib-local / go:lib-remote
# GO_LIB_LOCAL  = "github.com/nics-dp/foo=../foo"
# GO_LIB_REMOTE = "github.com/nics-dp/foo@dev"

# ------------------------------------------------------------------------------
[task_config]
includes = ["git::https://github.com/nics-dp/meta.git//.mise/tasks?ref=main"]

# ==============================================================================
# Facade tasks
# ==============================================================================
[tasks.init]
silent = "stdout"
description = "Tidy and vendor Go modules"
depends = ["go:install"]
depends_post = ["meta:bump"]

[tasks.clean]
silent = "stdout"
description = "Wipe Go artifacts"
depends = ["go:clean"]

[tasks.test]
description = "Run Go tests with race + coverage and generate report"
depends = ["go:test --race --coverage"]
depends_post = ["go:report"]

[tasks.update]
silent = "stdout"
description = "Bump deps, update submodules, and refresh shared atoms"
# meta:bump runs first in its OWN invocation (run array steps are separate
# `mise run` processes): it refreshes the shared atom cache, then the deps
# step re-resolves and runs against the latest upstream atoms. Separate
# invocations also avoid the cache-clear race that depends/depends_post had.
run = ["mise run meta:bump", "mise run go:update ::: gs:update"]
[tasks.ci]
description = "Run all CI checks"
depends = [
  "go:lint-fix",
  "go:sast",
  "go:audit",
  "go:dead-code",
  # "go:deptree",
  "ci:semgrep golang",
]


[tasks.release-check]
description = "Read-only validation for all/release driver (ci minus file-mutating *-fix atoms)"
depends = [
  "go:lint-check",
  "go:sast",
  "go:audit",
  "go:dead-code",
  "ci:semgrep golang",
]

[tasks.all]
description = "init -> generate -> api-fix sequentially, then test/release-check in parallel"
run = ["mise run init", "mise run go:generate", "mise run go:api-fix", "mise run test ::: release-check"]

[tasks.sbom]
description = "Generate enriched SBOM and scan"
depends = ["sbom:trivy", "sbom:grype"]
