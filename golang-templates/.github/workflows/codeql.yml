# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# CodeQL workflow 模板 (Go 專案)
# Thin wrapper of nics-dp/meta codeql-reusable.yml
#
# 使用方式: 複製到新 repo 的 .github/workflows/codeql.yml
#
# 參數:
# - go-cgo-enabled: "1" 時啟用 CGO build (service repo)
# - use-private-go-modules: true 時透過 GH_PAT_READ_NICSDP 取得 private modules
# - submodules: 'recursive' 時於 checkout 啟用 submodules
# - actions language 僅 dev-cluster / patroni 啟用，非通用模板

name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  schedule:
    - cron: "0 0 * * 1" # Every Monday 08:00 on UTC+8
  workflow_dispatch:

jobs:
  analyze:
    uses: nics-dp/meta/.github/workflows/codeql-reusable.yml@main
    with:
      matrix-include: '[{"language":"go","build-mode":"manual"}]'
      go-cgo-enabled: "0" # TODO: service repo (CGO 必要) 改為 "1"
      use-private-go-modules: true
    secrets:
      GH_PAT_READ_NICSDP: ${{ secrets.GH_PAT_READ_NICSDP }}
