# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: codeql-reusable

on:
  workflow_call:
    inputs:
      matrix-include:
        description: 'JSON array of {language, build-mode} entries. Example: [{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"manual"}]'
        required: true
        type: string
      go-cgo-enabled:
        description: 'CGO_ENABLED env (0 or 1) for the Manual Go build step'
        required: false
        type: string
        default: "0"
      use-private-go-modules:
        description: 'Configure GOPRIVATE/GH_PAT for nics-dp private modules'
        required: false
        type: boolean
        default: false
      submodules:
        description: 'Submodule checkout mode: "false", "true", or "recursive". Typed as string (not boolean) so callers can request recursive checkout.'
        required: false
        type: string
        default: "false"
    secrets:
      GH_PAT_READ_NICSDP:
        required: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      HAS_GH_PAT: ${{ secrets.GH_PAT_READ_NICSDP != '' }}
      USE_PRIVATE_GO: ${{ inputs.use-private-go-modules }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix-include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: ${{ inputs.submodules }}
          # Use PAT only when checking out submodules (likely private nics-dp repos);
          # default github.token suffices for the main repo and reduces token surface.
          token: ${{ inputs.submodules != 'false' && secrets.GH_PAT_READ_NICSDP || github.token }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true
          queries: security-extended,security-and-quality
          external-repository-token: ${{ secrets.GH_PAT_READ_NICSDP }}

      - name: Configure access to private Go modules
        if: matrix.language == 'go' && env.USE_PRIVATE_GO == 'true' && env.HAS_GH_PAT == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT_READ_NICSDP }}
        run: |
          {
            echo "GOPRIVATE=github.com/nics-dp"
            echo "GONOPROXY=github.com/nics-dp"
            echo "GONOSUMDB=github.com/nics-dp"
          } >> "$GITHUB_ENV"
          git config --global url."https://${GH_PAT}@github.com/nics-dp".insteadOf "https://github.com/nics-dp"
          git config --global url."https://${GH_PAT}@github.com/nics-dp/".insteadOf "git@github.com:nics-dp/"

      - name: Manual Go build for CodeQL
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: ${{ inputs.go-cgo-enabled }}
          GOOS: linux
        run: |
          go mod vendor
          go build -mod=vendor ./...

      - name: Revoke private module access
        if: always() && matrix.language == 'go' && env.USE_PRIVATE_GO == 'true' && env.HAS_GH_PAT == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT_READ_NICSDP }}
        run: |
          git config --global --remove-section "url.https://${GH_PAT}@github.com/nics-dp" 2>/dev/null || true
          git config --global --remove-section "url.https://${GH_PAT}@github.com/nics-dp/" 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{matrix.language}}"
