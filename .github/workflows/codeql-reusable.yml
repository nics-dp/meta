# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: codeql-reusable

on:
  workflow_call:
    inputs:
      matrix-include:
        description: 'JSON array of {language, build-mode} entries. Example: [{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"manual"}]'
        required: true
        type: string
      go-cgo-enabled:
        description: 'CGO_ENABLED env (0 or 1) for the Manual Go build step'
        required: false
        type: string
        default: "0"
      use-private-go-modules:
        description: 'Configure GOPRIVATE/GH_PAT for nics-dp private modules'
        required: false
        type: boolean
        default: false
      submodules:
        description: 'Submodule checkout mode: "false", "true", or "recursive". Typed as string (not boolean) so callers can request recursive checkout.'
        required: false
        type: string
        default: "false"
      runs_on:
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}''). Defaults to the releasers 8-core group; CodeQL Go analysis is CPU/RAM-bound and benefits from it.'
        required: false
        type: string
        default: '{"group":"releasers"}'
    secrets:
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (paired with the CI_READ_APP_CLIENT_ID org variable)."

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      # secrets cannot be used in step-level if:, so bridge to env here.
      HAS_CI_APP: ${{ vars.CI_READ_APP_CLIENT_ID != '' && secrets.ci_read_app_private_key != '' }}
      USE_PRIVATE_GO: ${{ inputs.use-private-go-modules }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix-include) }}

    steps:
      # Mint a nics-dp-ci-read App token for private module access. The client-id comes
      # from the CI_READ_APP_CLIENT_ID org variable; when the private key is absent the private-module steps are skipped.
      - name: Setup | Mint private-module token
        id: priv-token
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: ${{ inputs.submodules }}
          # Use the App token only when checking out submodules (likely private nics-dp
          # repos); default github.token suffices for the main repo and reduces token surface.
          token: ${{ inputs.submodules != 'false' && steps.priv-token.outputs.token || github.token }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true
          queries: security-extended,security-and-quality
          external-repository-token: ${{ steps.priv-token.outputs.token }}

      - name: Configure access to private Go modules
        if: matrix.language == 'go' && env.USE_PRIVATE_GO == 'true' && env.HAS_CI_APP == 'true'
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          {
            echo "GOPRIVATE=github.com/nics-dp"
            echo "GONOPROXY=github.com/nics-dp"
            echo "GONOSUMDB=github.com/nics-dp"
          } >> "$GITHUB_ENV"
          # Self-healing: drop any stale token-bearing url.*@github.com/nics-dp
          # insteadOf rewrites left by a prior run before adding this run's fresh
          # token, so an equal-length insteadOf tie can't pick up an expired token.
          while read -r s; do
            if [ -n "$s" ]; then git config --global --remove-section "$s" 2>/dev/null || true; fi
          done < <(git config --global --name-only --get-regexp '^url\..*@github\.com/nics-dp' 2>/dev/null | sed -E 's/\.insteadof$//' | sort -u || true)
          git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp".insteadOf "https://github.com/nics-dp"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp/".insteadOf "git@github.com:nics-dp/"

      - name: Clear stale shallow Go module VCS cache
        if: matrix.language == 'go'
        run: |
          # dependency-caching restores a shallow git module cache; validating a new
          # pseudo-version then runs `git fetch --unshallow`, which races on the
          # restored shallow state ("shallow file has changed since we read it").
          # Drop the VCS cache so private modules are re-cloned cleanly each run.
          gomodcache="$(go env GOMODCACHE)"
          if [ -n "$gomodcache" ]; then
            rm -rf "${gomodcache}/cache/vcs" 2>/dev/null || true
          fi

      - name: Manual Go build for CodeQL
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: ${{ inputs.go-cgo-enabled }}
          GOOS: linux
        run: |
          go mod vendor
          go build -mod=vendor ./...

      - name: Revoke private module access
        if: always() && matrix.language == 'go' && env.USE_PRIVATE_GO == 'true' && env.HAS_CI_APP == 'true'
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${GH_PAT}@github.com/nics-dp" 2>/dev/null || true
          git config --global --remove-section "url.https://x-access-token:${GH_PAT}@github.com/nics-dp/" 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{matrix.language}}"
