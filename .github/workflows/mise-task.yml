# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Reusable workflow: run a single mise task on a fresh runner.
#
# Centralizes the checkout + jdx/mise-action setup so downstream repos pin one
# ref (this file's @ref) instead of pinning each action SHA themselves.
#
# Usage in downstream `.github/workflows/ci.yml`:
#   jobs:
#     checks:
#       name: ${{ matrix.name }}
#       strategy:
#         fail-fast: false
#         matrix:
#           include:
#             - { name: "Go Lint", task: "go:lint-check" }
#       uses: nics-dp/meta/.github/workflows/mise-task.yml@main
#       with:
#         name: ${{ matrix.name }}
#         task: ${{ matrix.task }}
#         private-modules: true
#       secrets:
#         gh_pat: ${{ secrets.GH_PAT_READ_NICSDP }}

name: mise-task

on:
  workflow_call:
    inputs:
      task:
        description: "Mise task to run (e.g. 'go:lint-check', 'ci:semgrep golang')"
        required: true
        type: string
      name:
        description: "Display name for the GH job summary section (defaults to task)"
        required: false
        type: string
        default: ""
      runs_on:
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}'')'
        required: false
        type: string
        default: '"ubuntu-latest"'
      fetch-depth:
        description: "Git fetch depth (use 0 for full history; default 1)"
        required: false
        type: number
        default: 1
      private-modules:
        description: "Configure git to authenticate to private GitHub repos via gh_pat secret"
        required: false
        type: boolean
        default: false
    secrets:
      gh_pat:
        description: "Fallback PAT (read access to private modules) used only when the ci_read_app_* App secrets are not provided. Relevant when private-modules=true."
        required: false
      ci_read_app_id:
        required: false
        description: "App ID of the nics-dp-ci-read GitHub App. Preferred over gh_pat for private module access; pass via secrets: inherit. Falls back to gh_pat when empty."
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (pair with ci_read_app_id)."

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.name != '' && inputs.name || inputs.task }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # mise's minimum_release_age supply-chain control is forwarded to the pipx
    # backend as a pip-only flag (--pip-args=--uploaded-prior-to=...), which the
    # uv-backed pipx installer rejects ("Fatal error from uv"), breaking pipx
    # tool installs such as semgrep. Setting the age to 0 disables that
    # injection. "0" requires mise >= 2026.6.3 (older mise rejects it as an
    # invalid duration), and the self-hosted pool reuses cached mise binaries
    # of mixed versions, so the action below pins mise to 2026.6.3.
    #
    # MISE_USE_VERSIONS_HOST=false: mise-versions.jdx.dev (the CDN that caches
    # version listings) frequently 403s, spamming "outcome=failed status=403
    # fallback=true" warnings even though the source-direct fallback already
    # succeeds. Disabling the host makes mise resolve versions straight from
    # each backend's source, so `latest` keeps working without the noise.
    # Trade-off: a few more direct GitHub/aqua calls on version lookup.
    env:
      MISE_MINIMUM_RELEASE_AGE: "0"
      MISE_USE_VERSIONS_HOST: "false"
      # secrets cannot be used in step-level if:, so bridge to env here.
      HAS_CI_APP: ${{ secrets.ci_read_app_id != '' && secrets.ci_read_app_private_key != '' }}
    steps:
      # Prefer a nics-dp-ci-read App token for private module access, but only when this
      # run actually needs private modules. The App secrets arrive via `secrets: inherit`;
      # when absent (legacy callers) the step is skipped and the git-config below falls
      # back to gh_pat. See nics-dp PAT->App migration.
      - name: Setup | Mint private-module token
        id: priv-token
        if: ${{ env.HAS_CI_APP == 'true' && inputs.private-modules }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ci_read_app_id }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.6.3"
          cache: true

      - name: Configure git for private modules
        if: ${{ inputs.private-modules }}
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token || secrets.gh_pat }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::private-modules=true but neither the ci-read App token nor gh_pat is available"
            exit 0
          fi
          git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp/".insteadOf "https://github.com/nics-dp/"

      - id: check
        name: Run ${{ inputs.task }}
        run: |
          set +e
          mise run ${{ inputs.task }} 2>&1 | tee /tmp/output.log
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Job summary
        if: always()
        env:
          JOB_NAME: ${{ inputs.name != '' && inputs.name || inputs.task }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "## $JOB_NAME"
            echo
            if [ "$OUTCOME" = "success" ]; then echo "✅ pass"; else echo "❌ fail"; fi
            echo
            echo '<details><summary>output</summary>'
            echo
            echo '```'
            tail -n 300 /tmp/output.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce
        if: steps.check.outcome == 'failure'
        run: exit 1
