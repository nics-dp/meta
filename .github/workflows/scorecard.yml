# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Scorecard

# OpenSSF Scorecard (the only variant): runs Scorecard, filters posture noise
# from the SARIF, and uploads the result to GitHub code scanning (Security >
# Code scanning, category
# `scorecard`), and NEVER publishes to the public OpenSSF API. Callers add a job
# that `uses:` this; every nics-dp repo (including meta itself, via
# self-supply-chain.yml) routes through here so posture noise is filtered
# consistently.
#
# Because this file never publishes (publish_results: false), it is free to mint
# an App token and use a job env; the public OpenSSF publish path (verified
# server-side against a strict step allowlist) is not used anywhere.
#
# NON-BLOCKING throughout: a token-mint, scorecard, or upload failure never fails
# the caller's CI (mirrors security-sarif.yml).
on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
        description: "Retained for caller compatibility only. This workflow never publishes to the public OpenSSF API; a truthy value here is ignored."
    secrets:
      scorecard_app_private_key:
        required: false
        description: "Private key of the nics-dp-scorecard GitHub App (paired with the SCORECARD_APP_CLIENT_ID org variable). Minted into a short-lived repo_token so Scorecard's API queries (incl. Branch-Protection, which needs Administration: Read) score on PRIVATE repos. Without it scorecard falls back to GITHUB_TOKEN (queries fail on a private repo) and the run stays non-blocking."

permissions:
  contents: read

jobs:
  scorecard:
    # Pinned to ubuntu-latest: scorecard-action is a Linux/Docker-based action.
    runs-on: ubuntu-latest
    permissions:
      # checkout uses GITHUB_TOKEN; SARIF upload writes code-scanning results.
      contents: read
      security-events: write
      actions: read
    env:
      # secrets cannot be used in step-level if: (the secrets context is not
      # available to if conditionals), so bridge to env here. The App is
      # identified by the SCORECARD_APP_CLIENT_ID org variable (client-id) plus
      # the scorecard_app_private_key secret (mirrors mise-task.yml).
      HAS_SCORECARD_APP: ${{ vars.SCORECARD_APP_CLIENT_ID != '' && secrets.scorecard_app_private_key != '' }}
    steps:
      # Mint a nics-dp-scorecard App token to use as repo_token. With neither
      # owner nor repositories set, create-github-app-token scopes the token to
      # the current repository (least privilege). Skipped when the App is not
      # configured; non-blocking so a mint failure (App not installed on this
      # repo, bad key, transient API error) leaves the token empty and
      # repo_token below falls back to GITHUB_TOKEN.
      - name: Mint Scorecard repo-read token
        id: sc-token
        if: ${{ env.HAS_SCORECARD_APP == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SCORECARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.scorecard_app_private_key }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Do not persist the GITHUB_TOKEN into the checkout so later steps
          # cannot be coerced into using it (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # non-blocking: a scorecard run error (e.g. no App token on a private
        # repo) must not fail the caller's CI (mirrors security-sarif.yml).
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          # repo_token drives all of scorecard's GitHub API queries. The App
          # token carries the reads scorecard needs on a private repo (incl.
          # Administration: Read for Branch-Protection); falls back to the
          # default token when the App is not configured.
          repo_token: ${{ steps.sc-token.outputs.token || github.token }}
          # Never publish to the public OpenSSF API.
          publish_results: false

      - name: Filter Scorecard SARIF posture noise
        # Copy results.sarif (written by the Docker scorecard-action as root) to a
        # runner-owned results.filtered.sarif, then filter the copy and upload that.
        # The copy + filter run inside Python, not a bash `cp` under `set -e`. Both
        # the copy and the filtered write go via a temp file + os.replace, so DST is
        # only ever a complete file. If the copy fails, results.filtered.sarif is
        # absent and the Select step below falls back to uploading the raw
        # results.sarif; if filtering fails after a successful copy, DST stays the
        # intact unfiltered copy and is uploaded (fail-safe). Temp files are always
        # cleaned up. Keeps genuine signal: TokenPermissionsID top-level
        # writes and external unpinned actions stay; job-level writes (required by
        # reusable delegation) and PinnedDependenciesID on nics-dp/ internal
        # reusables are dropped.
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'FILTER_PY'
          import json, os, re, shutil, sys
          from urllib.parse import unquote
          SRC = "results.sarif"
          DST = "results.filtered.sarif"
          CP_TMP = DST + ".copy.tmp"
          try:
              shutil.copyfile(SRC, CP_TMP)
              os.replace(CP_TMP, DST)
          except Exception as e:
              print(f"sarif-filter: cannot copy {SRC} -> {DST}: {e}; raw SARIF used as fallback")
              try:
                  os.remove(CP_TMP)
              except OSError:
                  pass
              sys.exit(0)
          try:
              with open(DST, encoding="utf-8") as fh:
                  data = json.load(fh)
              _lines_cache = {}
              def flagged_line(uri, line):
                  if not uri or not line:
                      return ""
                  path = unquote(uri)
                  if not os.path.isabs(path):
                      workspace = os.environ.get("GITHUB_WORKSPACE")
                      if workspace:
                          path = os.path.join(workspace, path)
                  if path not in _lines_cache:
                      try:
                          with open(path, encoding="utf-8") as fh2:
                              _lines_cache[path] = fh2.read().splitlines()
                      except Exception:
                          _lines_cache[path] = []
                  rows = _lines_cache[path]
                  return rows[line - 1] if 0 < line <= len(rows) else ""
              # Scorecard's Vulnerabilities check lists each vuln on its own
              # "Project is vulnerable to: <ID>" line. IDs come straight from OSV, so
              # the prefix varies by ecosystem (GO-*, OSV-*, PYSEC-*, RUSTSEC-*,
              # GHSA-*, CVE-*, ...). Capture the full remainder of each line rather
              # than a fixed ID pattern, so an unrecognized co-listed ID is preserved
              # instead of silently ignored (fail-safe: we only drop when GO-2026-5932
              # is the SOLE listed vuln).
              VULN_LINE_RE = re.compile(r"Project is vulnerable to:\s*(.+?)\s*$", re.M)
              def keep(r):
                  rid = r.get("ruleId")
                  msg = (r.get("message") or {}).get("text", "")
                  if rid == "TokenPermissionsID" and "jobLevel" in msg:
                      return False
                  if rid == "PinnedDependenciesID":
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      uri = (loc.get("artifactLocation") or {}).get("uri", "")
                      line = (loc.get("region") or {}).get("startLine")
                      if "nics-dp/" in flagged_line(uri, line):
                          return False
                  # Drop the Vulnerabilities finding when the ONLY vuln it lists is
                  # GO-2026-5932 (golang.org/x/crypto/openpgp unmaintained): a
                  # transitively-present, never-called subpackage with no fixed version
                  # (govulncheck confirms the symbols are not reachable). Scoped by
                  # exact ID set so a finding that also lists a real reachable vuln is
                  # kept. Mirrors the govulncheck SARIF filter in security-sarif.yml.
                  if rid == "VulnerabilitiesID":
                      vulns = {v.strip() for v in VULN_LINE_RE.findall(msg)}
                      if vulns == {"GO-2026-5932"}:
                          return False
                  return True
              removed = 0
              for run in data.get("runs", []):
                  before = run.get("results", []) or []
                  after = [r for r in before if keep(r)]
                  removed += len(before) - len(after)
                  run["results"] = after
              tmp = DST + ".tmp"
              try:
                  with open(tmp, "w", encoding="utf-8") as fh:
                      json.dump(data, fh, indent=2)
                  os.replace(tmp, DST)
              finally:
                  if os.path.exists(tmp):
                      try:
                          os.remove(tmp)
                      except OSError:
                          pass
              print(f"sarif-filter: removed {removed} posture-noise result(s)")
          except Exception as e:
              print(f"sarif-filter: filtering failed ({e}); uploading unfiltered copy")
          FILTER_PY

      - name: Select SARIF file to upload
        # Prefer the filtered SARIF; if the filter step produced no file at all
        # (e.g. it errored before writing one) fall back to the raw results.sarif so
        # code scanning still refreshes. Non-blocking best effort.
        id: pick
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f results.filtered.sarif ]; then
            echo "sarif_to_upload=results.filtered.sarif" >> "$GITHUB_OUTPUT"
          elif [ -f results.sarif ]; then
            echo "sarif_to_upload=results.sarif" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Scorecard SARIF
        if: always() && steps.pick.outputs.sarif_to_upload != ''
        # non-blocking: a failed upload must not fail the job (mirrors security-sarif.yml).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.pick.outputs.sarif_to_upload }}
          category: scorecard
