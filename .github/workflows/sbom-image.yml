# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: SBOM Image

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name for artifact naming (e.g., dcf-platform)"
      image_name:
        required: true
        type: string
        description: "Docker image name (e.g., dcf-platform)"
      digest:
        required: true
        type: string
        description: "Image digest from build (e.g., sha256:abc123...)"
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      sarif_ref:
        required: false
        type: string
        default: ""
        description: >
          Git ref (e.g. "refs/heads/dev") to attribute the image-scan SARIF
          (trivy-image / grype-image) to in code scanning. Empty (default) uses
          the triggering event's ref/sha. On a release the event ref is the tag,
          so image alerts land on a tag ref that the security overview never
          refreshes; set this to the default branch so each release supersedes
          the previous scan and stale alerts auto-close.
      snapshot:
        required: false
        type: boolean
        default: false
        description: "Snapshot mode (skip release upload)"
      attest:
        required: false
        type: boolean
        default: true
        description: >
          Generate a GitHub-native SBOM attestation binding the CycloneDX SBOM
          to the image digest (verifiable with `gh attestation verify`). Mirrors
          image-release.yml's `attest` input. A reusable workflow cannot raise
          the caller's token scopes, so when this is enabled the caller's job
          must grant attestations: write, id-token: write, artifact-metadata:
          write (for the attestation storage record) and (because the SBOM
          attestation is pushed to GHCR) packages: write. Set attest: false to
          skip it where the caller cannot grant those scopes.
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}'')'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY_GHCR: ghcr.io
  GHCR_NAMESPACE: nics-dp

jobs:
  sbom-image:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      actions: read
      contents: write
      # packages: write (not read) because attest-sbom runs with
      # push-to-registry: true, which pushes the SBOM attestation to the GHCR
      # package - the same permission set image-release.yml's attestation steps
      # use. The earlier `packages: read` was sufficient only for pulling the
      # image to generate the SBOM.
      packages: write
      security-events: write
      # attestations + id-token: write let actions/attest-sbom mint the SBOM
      # attestation and obtain an OIDC token for keyless Sigstore signing;
      # artifact-metadata: write lets it create the artifact storage record.
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      # When sarif_ref is set it also drives the checkout, so the workspace HEAD
      # is that branch's tip. codeql-action derives the uploaded analysis's
      # commit_oid from `git rev-parse HEAD` of the checkout (not the sha input;
      # see git-utils.ts getCommitOid), so checking the branch out here is what
      # makes commit_oid match the ref we attribute the SARIF to. Nothing in
      # this job reads the source tree (version comes from the release tag env,
      # the SBOM from the image digest, release upload from the tag), so this is
      # safe. Empty → default event-ref checkout (unchanged).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sarif_ref || inputs.ref }}
          fetch-depth: 1
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN into the checkout so later steps
          # cannot be coerced into using it (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [[ "$SNAPSHOT" == "true" ]]; then
            echo "version=0.0.0-snapshot+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # Emit the ref/sha passed to upload-sarif. When sarif_ref is set, sha is
      # the checkout HEAD (== the commit_oid codeql-action derives via
      # `git rev-parse HEAD`), so ref and commit agree; codeql-action also
      # requires both ref and sha when either is given. Empty outputs →
      # upload-sarif auto-detects the event ref/sha (unchanged default).
      - name: Resolve SARIF ref/sha
        id: sarifref
        env:
          SARIF_REF: ${{ inputs.sarif_ref }}
        run: |
          if [[ -n "$SARIF_REF" ]]; then
            { echo "ref=$SARIF_REF"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          else
            { echo "ref="; echo "sha="; } >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOM from image (CycloneDX JSON 1.6)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ inputs.image_name }}@${{ inputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      # GitHub-native SBOM attestation: bind the CycloneDX SBOM to the image
      # digest the SBOM was generated from. Both the subject (inputs.digest)
      # and the SBOM file exist in this job, so this is the correct place to
      # attest. Attests the as-generated sbom-image.cdx.json rather than the
      # parlay-enriched copy, so the attested document matches the SBOM the
      # scanners below consume. Verifiable with `gh attestation verify`.
      - name: Attest SBOM
        if: inputs.attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ inputs.image_name }}
          subject-digest: ${{ inputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true

      - name: Set up Go (for tooling)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Enrich SBOM with parlay
        run: |
          go install github.com/snyk/parlay@v0.11.0
          parlay ecosystems enrich sbom-image.cdx.json > enriched-image.cdx.json

      - name: Scan SBOM with Trivy (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: enriched-image.cdx.json
          format: sarif
          output: trivy-image.sarif

      - name: Fix Trivy SARIF empty artifact locations
        run: |
          jq '(.runs[].results[].locations[].physicalLocation.artifactLocation | select(.uri == "")) .uri = "sbom-image.cdx.json"' \
            trivy-image.sarif > trivy-image-fixed.sarif
          mv trivy-image-fixed.sarif trivy-image.sarif

      - name: Drop non-actionable openpgp advisory from Trivy SARIF
        run: |
          # Drop GO-2026-5932 (golang.org/x/crypto/openpgp, unmaintained, no fixed
          # version) before upload. It fires on the transitively-present openpgp
          # subpackage pulled in by the otelcol-contrib upstream binary whose
          # symbols we never call, so it is non-actionable here. Mirrors the
          # govulncheck filter in security-sarif.yml; unlike govulncheck the Trivy
          # SARIF carries no reachability level, so this drops by rule id
          # unconditionally. The full unfixed set (this advisory included) still
          # ships in the Trivy JSON asset on release runs (snapshot runs upload
          # no assets). Fail-safe: on any jq error the original SARIF is kept
          # and still uploaded.
          if jq '.runs[].results |= map(select(.ruleId != "GO-2026-5932"))' \
               trivy-image.sarif > trivy-image-filtered.sarif; then
            mv trivy-image-filtered.sarif trivy-image.sarif
          else
            echo "::warning::trivy-filter skipped (jq error); original SARIF kept"
            rm -f trivy-image-filtered.sarif
          fi

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
          # Empty ref/sha → upload-sarif auto-detects the event ref/sha.
          ref: ${{ steps.sarifref.outputs.ref }}
          sha: ${{ steps.sarifref.outputs.sha }}

      - name: Scan SBOM with Trivy (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: enriched-image.cdx.json
          format: json
          output: trivy-image.json

      - name: Scan SBOM with Grype (SARIF)
        if: always()
        id: grype-sarif
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom-image.cdx.json
          output-format: sarif
          severity-cutoff: high
          # Gate only on vulnerabilities with an available fix; base-image CVEs
          # that upstream marks not-fixed/wont-fix are unactionable and would
          # otherwise block every release. Full unfixed set stays visible via
          # the Trivy SARIF upload.
          only-fixed: true

      - name: Upload Grype SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: grype-image
          ref: ${{ steps.sarifref.outputs.ref }}
          sha: ${{ steps.sarifref.outputs.sha }}

      - name: Scan SBOM with Grype (JSON)
        id: grype-json
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom-image.cdx.json
          output-format: json
          severity-cutoff: high
          only-fixed: true

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
          GRYPE_JSON: ${{ steps.grype-json.outputs.json }}
        run: |
          mv enriched-image.cdx.json "${PROJECT_NAME}_${VERSION}_image.cdx.json"
          mv trivy-image.json "${PROJECT_NAME}_${VERSION}_image.trivy.json"
          mv "$GRYPE_JSON" "${PROJECT_NAME}_${VERSION}_image.grype.json"

      - name: Upload to GitHub Release
        if: ${{ !inputs.snapshot }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          gh release upload "$VERSION_TAG" \
            "${PROJECT_NAME}_${VERSION}_image.cdx.json" \
            "${PROJECT_NAME}_${VERSION}_image.trivy.json" \
            "${PROJECT_NAME}_${VERSION}_image.grype.json" \
            --clobber
