# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: go-release

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name for archive naming (e.g., dcf-platform)"
      binary:
        required: true
        type: string
        description: "Comma-separated name:path pairs (e.g., platform:./cmd/platform or tui:./cmd/tui,node:./cmd/node)"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64"
        description: "Comma-separated GOOS/GOARCH targets"
      go_version:
        required: false
        type: string
        default: "stable"
      cgo_enabled:
        required: false
        type: boolean
        default: false
        description: "Enable CGO for native and supported cross-compilation (linux amd64↔arm64)"
      go_env:
        required: false
        type: string
        default: "GOEXPERIMENT=jsonv2,simd,runtimesecret,goroutineleakprofile"
        description: "Extra env vars for build, one per line (e.g., GOEXPERIMENT=jsonv2)"
      ldflags:
        required: false
        type: string
        default: ""
        description: "Custom ldflags (default: -s -w with version/commit/date injection)"
      extra_build_flags:
        required: false
        type: string
        default: "-trimpath"
        description: "Extra go build flags"
      go_private_full:
        required: false
        type: boolean
        default: true
        description: "Set GOPRIVATE/GONOPROXY/GONOSUMDB for nics-dp private modules"
      notarize:
        required: false
        type: boolean
        default: false
        description: "Sign and notarize macOS binaries with quill"
      attest:
        required: false
        type: boolean
        default: true
        description: >
          Generate GitHub-native SLSA build provenance attestation for the
          released binaries (verifiable with `gh attestation verify`). A
          reusable workflow cannot raise the caller's token scopes, so when this
          is enabled the caller's job must grant attestations: write and
          id-token: write (the release job already needs id-token: write for the
          existing cosign keyless flow). Set attest: false to skip it where the
          caller cannot grant those scopes.
      snapshot:
        required: false
        type: boolean
        default: false
        description: "Snapshot build (no GitHub Release, short artifact retention)"
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: "Runner for Linux build jobs as JSON"
      runs_on_darwin:
        required: false
        type: string
        default: '"macos-latest"'
        description: "Runner for macOS build jobs as JSON"
      runs_on_windows:
        required: false
        type: string
        default: '"windows-latest"'
        description: "Runner for Windows build jobs as JSON"
    secrets:
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (paired with the CI_READ_APP_CLIENT_ID org variable)."
      quill_sign_p12:
        required: false
      quill_sign_password:
        required: false
      quill_notary_key:
        required: false
      quill_notary_key_id:
        required: false
      quill_notary_issuer:
        required: false

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN into the checkout so later steps
          # cannot be coerced into using it (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - name: Compute version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [[ "$SNAPSHOT" == "true" ]]; then
            echo "version=0.0.0-snapshot+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          else
            TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RUNS_ON_LINUX: ${{ inputs.runs_on }}
          RUNS_ON_DARWIN: ${{ inputs.runs_on_darwin }}
          RUNS_ON_WINDOWS: ${{ inputs.runs_on_windows }}
          CGO_ENABLED: ${{ inputs.cgo_enabled && '1' || '0' }}
        run: |
          MATRIX=$(echo "$PLATFORMS" | tr ',' '\n' | jq -R \
            --argjson linux_runner "$RUNS_ON_LINUX" \
            --argjson darwin_runner "$RUNS_ON_DARWIN" \
            --argjson windows_runner "$RUNS_ON_WINDOWS" \
            --arg cgo "$CGO_ENABLED" '
            split("/") |
            (if length == 3 then
              {goos: .[0], goarch: .[1], goarm: (.[2] | ltrimstr("v"))}
            else
              {goos: .[0], goarch: .[1], goarm: ""}
            end) |
            .runs_on = (
              if $cgo == "0" then $linux_runner
              elif .goos == "darwin" then $darwin_runner
              elif .goos == "windows" then $windows_runner
              else $linux_runner
              end
            )
          ' | jq -sc '{include: .}')
          echo "result=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # secrets cannot be used in step-level if:, so bridge to env here.
      HAS_CI_APP: ${{ vars.CI_READ_APP_CLIENT_ID != '' && secrets.ci_read_app_private_key != '' }}
    steps:
      # Mint a nics-dp-ci-read App token for private module access. The client-id comes
      # from the CI_READ_APP_CLIENT_ID org variable; when the private key is absent the private-module steps are skipped.
      - name: Setup | Mint private-module token
        id: priv-token
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN. Private module access is granted
          # separately via the App token (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Configure private git repository
        if: env.HAS_CI_APP == 'true'
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
          GO_PRIVATE_FULL: ${{ inputs.go_private_full }}
        run: |
          # Self-healing: drop any stale token-bearing url.*@github.com/nics-dp
          # insteadOf rewrites left by a prior run before adding this run's fresh
          # token, so an equal-length insteadOf tie can't pick up an expired token.
          while read -r s; do
            if [ -n "$s" ]; then git config --global --remove-section "$s" 2>/dev/null || true; fi
          done < <(git config --global --name-only --get-regexp '^url\..*@github\.com/nics-dp' 2>/dev/null | sed -E 's/\.insteadof$//' | sort -u || true)
          if [[ "$GO_PRIVATE_FULL" == "true" ]]; then
            {
              echo "GOPRIVATE=github.com/nics-dp"
              echo "GONOPROXY=github.com/nics-dp"
              echo "GONOSUMDB=github.com/nics-dp"
            } >> "$GITHUB_ENV"
            git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp/".insteadOf "git@github.com:nics-dp/"
          fi
          git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp".insteadOf "https://github.com/nics-dp"

      - name: Cache vendor directory
        if: contains(inputs.extra_build_flags, '-mod=vendor')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: go-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-vendor-${{ runner.os }}-${{ runner.arch }}-

      - name: Clear stale shallow Go module VCS cache
        if: contains(inputs.extra_build_flags, '-mod=vendor')
        run: |
          # setup-go's module cache can restore a shallow git clone of private
          # modules; validating a new pseudo-version then runs `git fetch
          # --unshallow`, which races on the restored shallow state ("shallow file
          # has changed since we read it"). Drop the VCS cache (keeps the download
          # zip cache) so private modules are re-cloned cleanly before vendoring.
          gomodcache="$(go env GOMODCACHE)"
          if [ -n "$gomodcache" ]; then
            rm -rf "${gomodcache}/cache/vcs" 2>/dev/null || true
          fi

      - name: Vendor Go modules
        if: contains(inputs.extra_build_flags, '-mod=vendor')
        run: go mod vendor

      - name: Install cross-compiler
        if: inputs.cgo_enabled && runner.arch == 'X64' && matrix.goarch == 'arm64' && matrix.goos == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ inputs.cgo_enabled && '1' || '0' }}
          GO_EXTRA_ENV: ${{ inputs.go_env }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LDFLAGS_INPUT: ${{ inputs.ldflags }}
          BINARY_PAIRS: ${{ inputs.binary }}
          EXTRA_BUILD_FLAGS: ${{ inputs.extra_build_flags }}
        run: |
          if [[ -n "$GO_EXTRA_ENV" ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && export "${line?}"
            done <<< "$GO_EXTRA_ENV"
          fi

          EXT=""
          if [[ "$GOOS" == "windows" ]]; then
            EXT=".exe"
          fi

          if [[ -n "$LDFLAGS_INPUT" ]]; then
            LDFLAGS="$LDFLAGS_INPUT"
          else
            # Inject version vars into the same package the mise go:build/go:run
            # tasks target (.mise/tasks/lib/go-version): <module>/internal/version
            # when that dir exists, else main. Keep this detection in sync with
            # that helper so local and release builds populate the same symbols.
            VERSION_PKG="main"
            MODULE=$(awk '/^module / {print $2; exit}' go.mod 2>/dev/null || echo "")
            if [[ -n "$MODULE" && -d "internal/version" ]]; then
              VERSION_PKG="${MODULE}/internal/version"
            fi
            LDFLAGS="-s -w -X ${VERSION_PKG}.Version=v${VERSION} -X ${VERSION_PKG}.Commit=$(git rev-parse HEAD) -X ${VERSION_PKG}.BuildDate=$(git log -1 --format=%cI)"
          fi

          mkdir -p output

          IFS=',' read -ra PAIRS <<< "$BINARY_PAIRS"
          for pair in "${PAIRS[@]}"; do
            IFS=':' read -r name path <<< "$pair"
            # shellcheck disable=SC2086
            go build $EXTRA_BUILD_FLAGS -ldflags "${LDFLAGS}" -o "output/${name}${EXT}" "$path"
          done

      - name: Sign and notarize macOS binaries
        if: matrix.goos == 'darwin' && inputs.notarize
        env:
          QUILL_SIGN_P12: ${{ secrets.quill_sign_p12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.quill_sign_password }}
          QUILL_NOTARY_KEY: ${{ secrets.quill_notary_key }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.quill_notary_key_id }}
          QUILL_NOTARY_ISSUER: ${{ secrets.quill_notary_issuer }}
        run: |
          go install github.com/anchore/quill/cmd/quill@v0.7.1
          for bin in output/*; do
            [[ -f "$bin" ]] && quill sign-and-notarize "$bin"
          done

      - name: Create archive
        id: archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          TARGET_GOARM: ${{ matrix.goarm }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          case "$TARGET_GOOS" in
            linux)   OS_TITLE="Linux" ;;
            darwin)  OS_TITLE="Darwin" ;;
            windows) OS_TITLE="Windows" ;;
            freebsd) OS_TITLE="FreeBSD" ;;
            openbsd) OS_TITLE="OpenBSD" ;;
            netbsd)  OS_TITLE="NetBSD" ;;
            *)       OS_TITLE="$TARGET_GOOS" ;;
          esac

          case "$TARGET_GOARCH" in
            amd64) ARCH_LABEL="x86_64" ;;
            386)   ARCH_LABEL="i386" ;;
            arm)   ARCH_LABEL="armv${TARGET_GOARM:-7}" ;;
            *)     ARCH_LABEL="$TARGET_GOARCH" ;;
          esac

          ARCHIVE_DIR="${PROJECT_NAME}_${VERSION}_${OS_TITLE}_${ARCH_LABEL}"
          mkdir -p "${ARCHIVE_DIR}"
          cp output/* "${ARCHIVE_DIR}/"
          cp README* LICENSE* "${ARCHIVE_DIR}/" 2>/dev/null || true

          if [[ "$TARGET_GOOS" == "windows" ]]; then
            7z a -tzip "${ARCHIVE_DIR}.zip" "${ARCHIVE_DIR}"
            echo "file=${ARCHIVE_DIR}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
            echo "file=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: ${{ inputs.snapshot && 7 || 30 }}

      # Raw (unarchived) linux binaries so image-release's prebuilt mode can
      # COPY them straight into the container without unpacking an archive. Linux
      # only — container images are linux; darwin/windows binaries ship as
      # release archives, not images. Short retention: consumed within the same
      # run by the image-build job.
      - name: Upload raw binary for image prebuilt
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # "prebuilt-" prefix marks this as internal plumbing for image-release's
          # prebuilt mode (not a user-facing release download); artifacts-comment
          # filters this prefix out of the PR comment. Include the GOARM suffix
          # (same as binary-*) so multiple 32-bit arm variants don't collide.
          name: prebuilt-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: output/
          retention-days: 1

      - name: Revoke private git repository access
        if: ${{ always() && env.HAS_CI_APP == 'true' }}
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${GH_PAT}@github.com/nics-dp/" 2>/dev/null || true
          git config --global --remove-section "url.https://x-access-token:${GH_PAT}@github.com/nics-dp" 2>/dev/null || true

  release:
    needs: [prepare, build]
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attestations + id-token: write are required for
      # actions/attest-build-provenance to mint the SLSA provenance attestation
      # and request an OIDC token for keyless signing. id-token: write is also
      # what cosign sign-blob already relies on for its keyless flow.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN. Release upload authenticates via
          # the explicit GH_TOKEN env below (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate source archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          git archive --format=tar.gz \
            --prefix="${PROJECT_NAME}_${VERSION}_source/" \
            HEAD > "dist/${PROJECT_NAME}_${VERSION}_source.tar.gz"

      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Sign checksums with cosign
        working-directory: dist
        run: cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes

      # GitHub-native SLSA build provenance, complementary to the cosign
      # sign-blob above. subject-checksums points at the same checksums.txt
      # that enumerates every released archive (sha256sum ./*.tar.gz ./*.zip),
      # so one attestation covers all artifacts and each is verifiable with
      # `gh attestation verify <archive>` and appears under the repo's
      # /attestations. checksums.txt itself is signed by cosign above.
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: gh release upload "$VERSION_TAG" dist/* --clobber
