# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# meta dogfoods its own reusable auto-release driver. This self-caller lets meta
# cut its own patch release (snapshot main -> `mise run all` validate -> tag ->
# GitHub Release) with the same driver consumer repos use; source_branch: main
# makes the merge to main a no-op and skips the back-merge.
name: Self-Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.5.5)"
        required: true
        type: string
      dry_run:
        description: "Validate only (skip merge/tag/release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  self-release:
    permissions:
      contents: write # auto-release.yml's GITHUB_TOKEN creates the release snapshot branch + tag/release
    uses: nics-dp/meta/.github/workflows/auto-release.yml@main
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      # meta has no dev branch: it works on main directly, so the release
      # snapshot is main itself and there is no back-merge.
      source_branch: main
      # Explicit, in lockstep with mise-task.yml: the "synchronized mise pins"
      # custom manager in renovate.json bumps this value together with the
      # others.
      mise_version: "2026.10.25"
    secrets:
      ci_read_app_private_key:     ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      pre_release_app_private_key: ${{ secrets.PRE_RELEASE_APP_PRIVATE_KEY }}
