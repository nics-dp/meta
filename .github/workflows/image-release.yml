# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Image Building and Publishing

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Docker image name (e.g., dcf-platform)"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
        description: "Target platforms for multi-arch build"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}'')'
      context:
        required: false
        type: string
        default: "."
        description: "Docker build context path"
      target:
        required: false
        type: string
        default: ""
        description: >
          Docker build target stage (e.g. 'runtime'). Empty (default) builds
          the last stage in the Dockerfile, preserving existing behaviour for
          callers whose final stage is already the intended image (e.g.
          otel-bundle, patroni, synth, which have no 'runtime' stage). Service
          repos with a trailing 'debug' stage should opt in with target: runtime
          to avoid shipping the debug image.
      build_args:
        required: false
        type: string
        default: ""
        description: "Docker build-args (multiline key=value)"
      env_file:
        required: false
        type: string
        default: ""
        description: "Path to env file to load into GITHUB_ENV before build (e.g., Dockerfile.env)"
      sbom:
        required: false
        type: boolean
        default: true
        description: "Enable BuildKit SBOM generation"
      provenance:
        required: false
        type: boolean
        default: true
        description: "Enable BuildKit SLSA provenance attestation"
      attest:
        required: false
        type: boolean
        default: true
        description: "Enable GitHub artifact attestation (Sigstore)"
      cosign:
        required: false
        type: boolean
        default: true
        description: "Sign container images with cosign (keyless)"
      snapshot:
        required: false
        type: boolean
        default: false
        description: "Snapshot mode: use SHA-based tags only (no semver, no latest)"
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      go_vendor:
        required: false
        type: boolean
        default: false
        description: "Run go mod vendor before Docker build to include vendor/ in build context"
      go_version:
        required: false
        type: string
        default: "stable"
        description: "Go version for vendor step (only used when go_vendor is true)"
      external_repo:
        required: false
        type: string
        default: ""
        description: "Optional external repo to checkout as the build context (e.g., 'patroni/patroni'). When set, `context` must equal `external_path` or be a subpath of it."
      external_ref:
        required: false
        type: string
        default: ""
        description: "Ref (branch/tag/sha) to checkout from external_repo. Required when external_repo is set (empty would default to upstream's default branch and make builds non-reproducible). Ignored when external_repo is empty."
      external_path:
        required: false
        type: string
        default: "external-src"
        description: "Local path under the workspace where external_repo is checked out. Ignored when external_repo is empty."
      dockerfile_path:
        required: false
        type: string
        default: ""
        description: "Path (relative to the caller repository workspace) of the Dockerfile to copy into external_path/Dockerfile, overriding any Dockerfile the external repo ships with. Must be a regular file (symlinks are rejected). Required when external_repo is set; otherwise ignored."
      external_repo_allowlist:
        required: false
        type: string
        default: ""
        description: >
          Newline-separated allowlist of permitted external_repo values, each an
          exact 'owner/repo' or an 'owner/*' glob. When non-empty, external_repo
          must match an entry or the build fails. SECURITY: callers MUST pass only
          static, maintainer-pinned literals to external_repo / external_ref and
          MUST NOT wire in PR-event data (e.g. github.event.pull_request.head.*).
          This allowlist is a defense-in-depth backstop for that caller contract,
          not a replacement for it. Ignored when external_repo is empty.
    outputs:
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build-and-push.outputs.digest }}
    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true
      ci_read_app_id:
        required: false
        description: "Legacy/unused: the nics-dp-ci-read App is now identified by the CI_READ_APP_CLIENT_ID org variable (client-id); this input is kept only for backward compatibility with callers still passing it, and is ignored."
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (paired with the CI_READ_APP_CLIENT_ID org variable)."

env:
  REGISTRY_DH: docker.io
  DH_NAMESPACE: nicsdp
  REGISTRY_GHCR: ghcr.io
  GHCR_NAMESPACE: nics-dp
  IMAGE_NAME: ${{ inputs.image_name }}

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      artifact-metadata: write
      attestations: write
      id-token: write
    env:
      # secrets cannot be used in step-level if:, so bridge to env here.
      HAS_CI_APP: ${{ vars.CI_READ_APP_CLIENT_ID != '' && secrets.ci_read_app_private_key != '' }}

    steps:
      # Mint a nics-dp-ci-read App token for private module access. The client-id comes
      # from the CI_READ_APP_CLIENT_ID org variable; when the private key is absent the private-module steps are skipped.
      - name: Setup | Mint private-module token
        id: priv-token
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_DH }}
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          # No authenticated git is run against this checkout afterwards, and in
          # non-external mode the workspace root is the docker build context.
          # Opt out of credential persistence (least privilege) so no token
          # material lingers in or near the build context.
          persist-credentials: false

      - name: Compute version metadata
        id: version
        # This is the only unconditional run: step in the job; runs_on is a
        # caller-supplied JSON input, so pin bash explicitly rather than rely on
        # the runner default (pwsh on Windows) — this script uses bash-only
        # syntax ([[ ]], indirect expansion ${!var}).
        shell: bash
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Mirror .mise/tasks/lib/go-version + go-release.yml so images inject
          # the SAME version symbols as the CLI/release binaries: snapshot ->
          # v0.0.0-snapshot+<shortsha>, release -> v<tag-without-v>. Exposed as
          # build-args (VERSION/COMMIT/BUILD_DATE) the Dockerfile feeds into
          # -ldflags -X <module>/internal/version.{Version,Commit,BuildDate}.
          # git rev-parse/log only need HEAD, so a shallow checkout is fine.
          if [[ "$SNAPSHOT" == "true" ]]; then
            VERSION="v0.0.0-snapshot+$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          else
            TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            VERSION="v${TAG#v}"
          fi
          COMMIT="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          BUILD_DATE="$(git log -1 --format=%cI 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Reject whitespace and quote characters before feeding these into
          # -ldflags downstream — Go's -ldflags parser splits on whitespace, so a
          # value with a space would be parsed as an extra linker flag. A
          # well-formed git ref name can't contain whitespace (git-check-ref-format
          # forbids spaces and control chars), so that branch is defence-in-depth;
          # a quote, however, is a permitted ref character, so VERSION (derived
          # from a git tag / ref name) can legitimately carry one. Mirrors the same
          # guard in .mise/tasks/lib/go-version so the image and CLI build paths
          # reject identical inputs. Don't echo the offending value: it lands in
          # CI logs.
          for _v in VERSION COMMIT BUILD_DATE; do
            if [[ "${!_v}" =~ [[:space:]\"\'] ]]; then
              echo "::error::$_v contains invalid characters (whitespace or quotes)"
              exit 1
            fi
          done
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Warn on orphan external_repo inputs
        if: inputs.external_repo == '' && (inputs.dockerfile_path != '' || inputs.external_ref != '')
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          EXTERNAL_REF: ${{ inputs.external_ref }}
        run: |
          # Escape a value before interpolating it into a ::error::/::warning::
          # workflow command, matching the GitHub Actions toolkit escapeData
          # (% -> %25, CR -> %0D, LF -> %0A; % first to avoid double-escaping).
          # Without this, a caller value containing newlines/CR/% could inject
          # additional workflow commands or truncate the message.
          esc() {
            local s=$1
            s=${s//'%'/'%25'}
            s=${s//$'\r'/'%0D'}
            s=${s//$'\n'/'%0A'}
            printf '%s' "$s"
          }
          # dockerfile_path / external_ref only take effect alongside
          # external_repo; surface a warning so callers don't assume they were
          # silently honored.
          if [[ -n "$DOCKERFILE_PATH" ]]; then
            echo "::warning::dockerfile_path ('$(esc "$DOCKERFILE_PATH")') was set without external_repo and will be ignored"
          fi
          if [[ -n "$EXTERNAL_REF" ]]; then
            echo "::warning::external_ref ('$(esc "$EXTERNAL_REF")') was set without external_repo and will be ignored"
          fi

      - name: Validate external_repo inputs
        if: inputs.external_repo != ''
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          EXTERNAL_PATH: ${{ inputs.external_path }}
          EXTERNAL_REF: ${{ inputs.external_ref }}
          EXTERNAL_REPO: ${{ inputs.external_repo }}
          EXTERNAL_REPO_ALLOWLIST: ${{ inputs.external_repo_allowlist }}
          CONTEXT: ${{ inputs.context }}
          GO_VENDOR: ${{ inputs.go_vendor }}
        run: |
          fail=0
          # Escape a value before interpolating it into a ::error::/::warning::
          # workflow command, matching the GitHub Actions toolkit escapeData
          # (% -> %25, CR -> %0D, LF -> %0A; % first to avoid double-escaping).
          # All caller-supplied values below are echoed through esc() so a
          # malformed/hostile value (newlines, CR, %) cannot inject additional
          # workflow commands or truncate the message.
          esc() {
            local s=$1
            s=${s//'%'/'%25'}
            s=${s//$'\r'/'%0D'}
            s=${s//$'\n'/'%0A'}
            printf '%s' "$s"
          }
          # Strip a single optional leading "./" for path comparison so
          # equivalent forms ("./external-src" and "external-src") validate
          # the same way. Error messages echo the caller's original value to
          # avoid confusion ("you wrote X but the tool says Y was rejected").
          NORM_DOCKERFILE_PATH="${DOCKERFILE_PATH#./}"
          NORM_EXTERNAL_PATH="${EXTERNAL_PATH#./}"
          NORM_CONTEXT="${CONTEXT#./}"

          # has_dotdot <path> — true only when ".." appears as a full path
          # component (i.e., "..", "../x", "x/..", or "x/../y"). Avoids
          # rejecting legitimate names like "my..dir" that merely contain "..".
          has_dotdot() {
            case "$1" in
              ..|../*|*/..|*/../*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # external_ref must be non-empty: an empty ref makes builds
          # non-reproducible by silently falling back to the default branch.
          if [[ -z "$EXTERNAL_REF" ]]; then
            echo "::error::external_ref is required when external_repo is set (empty ref would default to upstream's default branch, breaking reproducibility)"
            fail=1
          fi

          # external_repo must be a bare "owner/repo" slug: no whitespace, no
          # shell metacharacters, no URL, no extra path segments. Structural
          # guard against malformed/injected values; the allowlist below is the
          # actual trust boundary.
          if [[ ! "$EXTERNAL_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::external_repo must be a bare 'owner/repo' slug, got '$(esc "$EXTERNAL_REPO")'"
            fail=1
          fi

          # external_ref must look like a git ref/sha: only [A-Za-z0-9._/-].
          # (Non-emptiness is enforced above; skip the charset check when empty
          # so the more specific "required" error is the one that surfaces.)
          if [[ -n "$EXTERNAL_REF" && ! "$EXTERNAL_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::external_ref must contain only [A-Za-z0-9._/-], got '$(esc "$EXTERNAL_REF")'"
            fail=1
          fi

          # Defense-in-depth: when an allowlist is provided, external_repo must
          # match one of its entries (exact 'owner/repo' or 'owner/*' glob). A
          # trusted caller declares this allowlist as a literal, so PR-event data
          # cannot satisfy it even if a privileged caller wired it into
          # external_repo. When the allowlist is empty, external_repo is
          # unconstrained and we only warn (back-compat for existing callers).
          if [[ -n "$EXTERNAL_REPO_ALLOWLIST" ]]; then
            allow_match=0
            while IFS= read -r entry || [[ -n "$entry" ]]; do
              entry="${entry%$'\r'}"
              # trim surrounding whitespace
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry%"${entry##*[![:space:]]}"}"
              [[ -z "$entry" || "$entry" == \#* ]] && continue
              # Constrain each entry to the two documented forms before using it
              # as a glob: an exact 'owner/repo' or an 'owner/*' wildcard. This
              # keeps behaviour aligned with the input docs and rejects broader
              # or malformed globs (e.g. '*/*', 'owner/re?o', 'owner/[ab]',
              # entries with spaces or shell metacharacters) that would silently
              # match more than intended.
              if [[ ! "$entry" =~ ^[A-Za-z0-9._-]+/([A-Za-z0-9._-]+|\*)$ ]]; then
                echo "::error::external_repo_allowlist entry '$(esc "$entry")' must be 'owner/repo' or 'owner/*'"
                fail=1
                continue
              fi
              # shellcheck disable=SC2254 # intentional glob match against validated allowlist entry
              case "$EXTERNAL_REPO" in
                $entry) allow_match=1; break ;;
              esac
            done <<< "$EXTERNAL_REPO_ALLOWLIST"
            if [[ "$allow_match" -ne 1 ]]; then
              echo "::error::external_repo '$(esc "$EXTERNAL_REPO")' is not permitted by external_repo_allowlist"
              fail=1
            fi
          else
            echo "::warning::external_repo_allowlist is empty; external_repo ('$(esc "$EXTERNAL_REPO")') is unconstrained. Provide an allowlist and ensure callers never pass PR-event data to external_repo/external_ref."
          fi

          if [[ -z "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path is required when external_repo is set"
            fail=1
          elif [[ "$NORM_DOCKERFILE_PATH" == /* ]]; then
            echo "::error::dockerfile_path must be relative to the caller repository workspace, got '$(esc "$DOCKERFILE_PATH")'"
            fail=1
          elif has_dotdot "$NORM_DOCKERFILE_PATH"; then
            echo "::error::dockerfile_path must not contain a '..' path component, got '$(esc "$DOCKERFILE_PATH")'"
            fail=1
          elif [[ "$NORM_DOCKERFILE_PATH" == *[*?\[]* ]]; then
            echo "::error::dockerfile_path must not contain glob metacharacters (*, ?, [), got '$(esc "$DOCKERFILE_PATH")'"
            fail=1
          elif [[ -L "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path '$(esc "$DOCKERFILE_PATH")' must be a regular file, not a symlink"
            fail=1
          elif [[ ! -f "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path '$(esc "$DOCKERFILE_PATH")' not found in the caller repository workspace"
            fail=1
          fi

          if [[ -z "$NORM_EXTERNAL_PATH" || "$NORM_EXTERNAL_PATH" == "." ]]; then
            echo "::error::external_path must resolve to a directory under the workspace (not '.' / './' / empty), got '$(esc "$EXTERNAL_PATH")'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == /* ]]; then
            echo "::error::external_path must be relative, got '$(esc "$EXTERNAL_PATH")'"
            fail=1
          elif has_dotdot "$NORM_EXTERNAL_PATH"; then
            echo "::error::external_path must not contain a '..' path component, got '$(esc "$EXTERNAL_PATH")'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == */ ]]; then
            echo "::error::external_path must not end with '/', got '$(esc "$EXTERNAL_PATH")'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == *[*?\[]* ]]; then
            echo "::error::external_path must not contain glob metacharacters (*, ?, [), got '$(esc "$EXTERNAL_PATH")'"
            fail=1
          else
            case "$NORM_CONTEXT" in
              "$NORM_EXTERNAL_PATH"|"$NORM_EXTERNAL_PATH"/*) ;;
              *)
                echo "::error::context must be '$(esc "$EXTERNAL_PATH")' or a subpath when external_repo is set, got '$(esc "$CONTEXT")'"
                fail=1
                ;;
            esac
          fi

          # context '..' and glob checks run independently of the external_path
          # branches above so the more specific error still fires when
          # external_path itself fails validation.
          if has_dotdot "$NORM_CONTEXT"; then
            echo "::error::context must not contain a '..' path component, got '$(esc "$CONTEXT")'"
            fail=1
          fi
          if [[ "$NORM_CONTEXT" == *[*?\[]* ]]; then
            echo "::error::context must not contain glob metacharacters (*, ?, [), got '$(esc "$CONTEXT")'"
            fail=1
          fi

          # Reject dockerfile_path that lives under external_path. The external
          # checkout step clones into external_path with clean=true, removing
          # the caller's Dockerfile before the overlay cp reads it. In the
          # degenerate case where the external repo ships a file at the same
          # relative path, cp would silently use the external repo's content
          # as the overlay source - defeating the whole point of the overlay.
          # Only runs when both paths passed their own non-emptiness checks.
          if [[ -n "$NORM_DOCKERFILE_PATH" && -n "$NORM_EXTERNAL_PATH" && "$NORM_EXTERNAL_PATH" != "." ]]; then
            case "$NORM_DOCKERFILE_PATH" in
              "$NORM_EXTERNAL_PATH"|"$NORM_EXTERNAL_PATH"/*)
                echo "::error::dockerfile_path ('$(esc "$DOCKERFILE_PATH")') must not be inside external_path ('$(esc "$EXTERNAL_PATH")'); the external checkout would overwrite it before the overlay copy"
                fail=1
                ;;
            esac
          fi

          if [[ "$GO_VENDOR" == "true" ]]; then
            echo "::error::go_vendor is not supported with external_repo; the vendor step would run in the caller repo, leaving the external build context without vendor/"
            fail=1
          fi
          [[ "$fail" -eq 0 ]] || exit 1

      # SECURITY (CodeQL actions/untrusted-checkout): this step checks out an
      # external repo whose code is then executed by `docker build`, inside a
      # job that holds registry secrets and write scopes. That is safe ONLY
      # because external_repo/external_ref are maintainer-pinned inputs,
      # validated above (bare 'owner/repo' slug, sane ref charset, optional
      # allowlist), and callers are contractually required never to wire
      # PR-event data into them. Do NOT call this reusable workflow from a
      # pull_request_target / workflow_run caller that forwards
      # github.event.pull_request.head.* into external_repo or external_ref.
      - name: Checkout external repo
        if: inputs.external_repo != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.external_repo }}
          ref: ${{ inputs.external_ref }}
          path: ${{ inputs.external_path }}
          token: ${{ steps.priv-token.outputs.token || github.token }}
          # This checkout IS the docker build context. The token is still used
          # for the initial fetch, but must not be persisted afterwards: never
          # run authenticated git here, and keep credential material out of the
          # build context. (checkout v6 stores creds under RUNNER_TEMP rather
          # than .git/config, but opting out is the explicit least-privilege
          # guarantee and is robust against version/behaviour changes.)
          persist-credentials: false

      - name: Overlay Dockerfile onto external source
        if: inputs.external_repo != ''
        env:
          SRC: ${{ inputs.dockerfile_path }}
          DEST: ${{ inputs.external_path }}/Dockerfile
        run: |
          # Remove any existing DEST first so cp cannot follow a symlink the
          # external repo may ship at that path. Tolerate rm's exit code with
          # `|| true` so the `[[ -e ]]` check below can fire with a clear
          # error message when DEST is a directory (rm -f fails on dirs, and
          # without the `|| true` the step would abort on the bare rm error
          # under `set -e`, never reaching this branch).
          rm -f -- "$DEST" || true
          if [[ -e "$DEST" || -L "$DEST" ]]; then
            echo "::error::cannot overlay Dockerfile onto '$DEST': path still exists after rm (likely a directory)"
            exit 1
          fi
          cp -- "$SRC" "$DEST"

      - name: Prepare non-secret build args from env file
        id: env-args
        if: inputs.env_file != ''
        env:
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          # IMPORTANT: The env file is used to populate both GITHUB_ENV and the
          # "build_args" output, which is intended to be passed to Docker build-args.
          # Docker build args are NOT secret-safe (they may appear in image metadata,
          # layers, or logs), so the env file MUST NOT contain secrets or credentials.
          #
          # Only export valid KEY=VALUE lines (shell-safe keys, skip invalid lines)
          DELIM="ENV_ARGS_EOF_${RANDOM}${RANDOM}"
          echo "build_args<<${DELIM}" >> "$GITHUB_OUTPUT"
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*) ]]; then
              echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
              echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            fi
          done < "$ENV_FILE"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Set up Go for vendoring
        if: inputs.go_vendor
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Configure private modules and vendor
        if: inputs.go_vendor
        env:
          # the minted App token (empty when ci_read_app_* not inherited).
          HAS_PRIV: ${{ env.HAS_CI_APP == 'true' }}
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          if [[ "$HAS_PRIV" == "true" ]]; then
            # Self-healing: drop any stale token-bearing url.*@github.com/nics-dp
            # insteadOf rewrites left by a prior run before adding this run's
            # fresh token, so an equal-length insteadOf tie can't pick up an
            # expired token.
            while read -r s; do
              if [ -n "$s" ]; then git config --global --remove-section "$s" 2>/dev/null || true; fi
            done < <(git config --global --name-only --get-regexp '^url\..*@github\.com/nics-dp' 2>/dev/null | sed -E 's/\.insteadof$//' | sort -u || true)
            git config --global url."https://x-access-token:${GH_PAT}@github.com/nics-dp".insteadOf "https://github.com/nics-dp"
          fi
          go env -w GOPRIVATE=github.com/nics-dp GONOPROXY=github.com/nics-dp GONOSUMDB=github.com/nics-dp
          go mod vendor

      - name: Revoke private module access
        # Separate always()-guarded step: go mod vendor runs under `set -e`, so an
        # inline revoke after it would be skipped on vendor failure, leaving the
        # token-bearing insteadOf rewrite in the runner's global git config
        # (the releasers group runners are not ephemeral). Mirrors go-release.yml.
        if: ${{ always() && inputs.go_vendor && env.HAS_CI_APP == 'true' }}
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${GH_PAT}@github.com/nics-dp" 2>/dev/null || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY_DH }}/${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short,enable=${{ inputs.snapshot }}
            type=sha,prefix=,format=long,enable=${{ inputs.snapshot }}
            type=semver,pattern=v{{version}},enable=${{ !inputs.snapshot }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !inputs.snapshot }}
            type=semver,pattern=v{{major}},enable=${{ !inputs.snapshot }}
            type=ref,event=branch,enable=${{ !inputs.snapshot }}
            type=ref,event=pr,enable=${{ !inputs.snapshot }}
          flavor: |
            latest=${{ !inputs.snapshot && 'auto' || 'false' }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          # In external_repo mode the overlaid Dockerfile lives at
          # external_path/Dockerfile, which may differ from context (e.g., when
          # caller points context at a monorepo subpath). Pin file explicitly
          # so build never silently picks up an upstream Dockerfile.
          #
          # When external_repo is not set, fall back to ${context}/Dockerfile.
          # This is the path build-push-action would currently infer on its
          # own, but setting it explicitly pins behaviour against future action
          # changes and keeps existing callers identical regardless of how the
          # action handles an empty `file:` input.
          file: ${{ inputs.external_repo != '' && format('{0}/Dockerfile', inputs.external_path) || format('{0}/Dockerfile', inputs.context) }}
          # Empty target lets build-push-action build the Dockerfile's last
          # stage (current behaviour). Service callers pass target: runtime to
          # ship the hardened runtime stage instead of the trailing debug stage.
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            ${{ inputs.build_args }}
            ${{ steps.env-args.outputs.build_args }}
          secrets: |
            github_token=${{ steps.priv-token.outputs.token || secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          sbom: ${{ inputs.sbom }}
          provenance: ${{ inputs.provenance && 'mode=max' || 'false' }}

      - name: Generate artifact attestation (DockerHub)
        if: inputs.attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: index.docker.io/${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (GHCR)
        if: inputs.attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (DockerHub)
        if: inputs.cosign
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "index.docker.io/${DH_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"

      - name: Sign image (GHCR)
        if: inputs.cosign
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_GHCR}/${GHCR_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
