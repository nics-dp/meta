# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Image Building and Publishing

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Docker image name (e.g., dcf-platform)"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
        description: "Target platforms for multi-arch build"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}'')'
      context:
        required: false
        type: string
        default: "."
        description: "Docker build context path"
      build_args:
        required: false
        type: string
        default: ""
        description: "Docker build-args (multiline key=value)"
      env_file:
        required: false
        type: string
        default: ""
        description: "Path to env file to load into GITHUB_ENV before build (e.g., Dockerfile.env)"
      sbom:
        required: false
        type: boolean
        default: true
        description: "Enable BuildKit SBOM generation"
      provenance:
        required: false
        type: boolean
        default: true
        description: "Enable BuildKit SLSA provenance attestation"
      attest:
        required: false
        type: boolean
        default: true
        description: "Enable GitHub artifact attestation (Sigstore)"
      cosign:
        required: false
        type: boolean
        default: true
        description: "Sign container images with cosign (keyless)"
      snapshot:
        required: false
        type: boolean
        default: false
        description: "Snapshot mode: use SHA-based tags only (no semver, no latest)"
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      go_vendor:
        required: false
        type: boolean
        default: false
        description: "Run go mod vendor before Docker build to include vendor/ in build context"
      go_version:
        required: false
        type: string
        default: "stable"
        description: "Go version for vendor step (only used when go_vendor is true)"
      external_repo:
        required: false
        type: string
        default: ""
        description: "Optional external repo to checkout as the build context (e.g., 'patroni/patroni'). When set, `context` must equal `external_path` or be a subpath of it."
      external_ref:
        required: false
        type: string
        default: ""
        description: "Ref (branch/tag/sha) to checkout from external_repo. Required when external_repo is set (empty would default to upstream's default branch and make builds non-reproducible). Ignored when external_repo is empty."
      external_path:
        required: false
        type: string
        default: "external-src"
        description: "Local path under the workspace where external_repo is checked out. Ignored when external_repo is empty."
      dockerfile_path:
        required: false
        type: string
        default: ""
        description: "Path (relative to the caller repository workspace) of the Dockerfile to copy into external_path/Dockerfile, overriding any Dockerfile the external repo ships with. Must be a regular file (symlinks are rejected). Required when external_repo is set; otherwise ignored."
      external_repo_allowlist:
        required: false
        type: string
        default: ""
        description: >
          Newline-separated allowlist of permitted external_repo values, each an
          exact 'owner/repo' or an 'owner/*' glob. When non-empty, external_repo
          must match an entry or the build fails. SECURITY: callers MUST pass only
          static, maintainer-pinned literals to external_repo / external_ref and
          MUST NOT wire in PR-event data (e.g. github.event.pull_request.head.*).
          This allowlist is a defense-in-depth backstop for that caller contract,
          not a replacement for it. Ignored when external_repo is empty.
    outputs:
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build-and-push.outputs.digest }}
    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true
      gh_pat:
        required: false
        description: "Optional PAT for GitHub registry access; falls back to GITHUB_TOKEN when not provided (with its usual permission limits)."

env:
  REGISTRY_DH: docker.io
  DH_NAMESPACE: nicsdp
  REGISTRY_GHCR: ghcr.io
  GHCR_NAMESPACE: nics-dp
  IMAGE_NAME: ${{ inputs.image_name }}

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      artifact-metadata: write
      attestations: write
      id-token: write

    steps:
      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_DH }}
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Warn on orphan external_repo inputs
        if: inputs.external_repo == '' && (inputs.dockerfile_path != '' || inputs.external_ref != '')
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          EXTERNAL_REF: ${{ inputs.external_ref }}
        run: |
          # dockerfile_path / external_ref only take effect alongside
          # external_repo; surface a warning so callers don't assume they were
          # silently honored.
          if [[ -n "$DOCKERFILE_PATH" ]]; then
            echo "::warning::dockerfile_path ('$DOCKERFILE_PATH') was set without external_repo and will be ignored"
          fi
          if [[ -n "$EXTERNAL_REF" ]]; then
            echo "::warning::external_ref ('$EXTERNAL_REF') was set without external_repo and will be ignored"
          fi

      - name: Validate external_repo inputs
        if: inputs.external_repo != ''
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          EXTERNAL_PATH: ${{ inputs.external_path }}
          EXTERNAL_REF: ${{ inputs.external_ref }}
          EXTERNAL_REPO: ${{ inputs.external_repo }}
          EXTERNAL_REPO_ALLOWLIST: ${{ inputs.external_repo_allowlist }}
          CONTEXT: ${{ inputs.context }}
          GO_VENDOR: ${{ inputs.go_vendor }}
        run: |
          fail=0
          # Strip a single optional leading "./" for path comparison so
          # equivalent forms ("./external-src" and "external-src") validate
          # the same way. Error messages echo the caller's original value to
          # avoid confusion ("you wrote X but the tool says Y was rejected").
          NORM_DOCKERFILE_PATH="${DOCKERFILE_PATH#./}"
          NORM_EXTERNAL_PATH="${EXTERNAL_PATH#./}"
          NORM_CONTEXT="${CONTEXT#./}"

          # has_dotdot <path> — true only when ".." appears as a full path
          # component (i.e., "..", "../x", "x/..", or "x/../y"). Avoids
          # rejecting legitimate names like "my..dir" that merely contain "..".
          has_dotdot() {
            case "$1" in
              ..|../*|*/..|*/../*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # external_ref must be non-empty: an empty ref makes builds
          # non-reproducible by silently falling back to the default branch.
          if [[ -z "$EXTERNAL_REF" ]]; then
            echo "::error::external_ref is required when external_repo is set (empty ref would default to upstream's default branch, breaking reproducibility)"
            fail=1
          fi

          # external_repo must be a bare "owner/repo" slug: no whitespace, no
          # shell metacharacters, no URL, no extra path segments. Structural
          # guard against malformed/injected values; the allowlist below is the
          # actual trust boundary.
          if [[ ! "$EXTERNAL_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::external_repo must be a bare 'owner/repo' slug, got '$EXTERNAL_REPO'"
            fail=1
          fi

          # external_ref must look like a git ref/sha: only [A-Za-z0-9._/-].
          # (Non-emptiness is enforced above; skip the charset check when empty
          # so the more specific "required" error is the one that surfaces.)
          if [[ -n "$EXTERNAL_REF" && ! "$EXTERNAL_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::external_ref must contain only [A-Za-z0-9._/-], got '$EXTERNAL_REF'"
            fail=1
          fi

          # Defense-in-depth: when an allowlist is provided, external_repo must
          # match one of its entries (exact 'owner/repo' or 'owner/*' glob). A
          # trusted caller declares this allowlist as a literal, so PR-event data
          # cannot satisfy it even if a privileged caller wired it into
          # external_repo. When the allowlist is empty, external_repo is
          # unconstrained and we only warn (back-compat for existing callers).
          if [[ -n "$EXTERNAL_REPO_ALLOWLIST" ]]; then
            allow_match=0
            while IFS= read -r entry || [[ -n "$entry" ]]; do
              entry="${entry%$'\r'}"
              # trim surrounding whitespace
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry%"${entry##*[![:space:]]}"}"
              [[ -z "$entry" || "$entry" == \#* ]] && continue
              # shellcheck disable=SC2254 # intentional glob match against trusted allowlist entry
              case "$EXTERNAL_REPO" in
                $entry) allow_match=1; break ;;
              esac
            done <<< "$EXTERNAL_REPO_ALLOWLIST"
            if [[ "$allow_match" -ne 1 ]]; then
              echo "::error::external_repo '$EXTERNAL_REPO' is not permitted by external_repo_allowlist"
              fail=1
            fi
          else
            echo "::warning::external_repo_allowlist is empty; external_repo ('$EXTERNAL_REPO') is unconstrained. Provide an allowlist and ensure callers never pass PR-event data to external_repo/external_ref."
          fi

          if [[ -z "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path is required when external_repo is set"
            fail=1
          elif [[ "$NORM_DOCKERFILE_PATH" == /* ]]; then
            echo "::error::dockerfile_path must be relative to the caller repository workspace, got '$DOCKERFILE_PATH'"
            fail=1
          elif has_dotdot "$NORM_DOCKERFILE_PATH"; then
            echo "::error::dockerfile_path must not contain a '..' path component, got '$DOCKERFILE_PATH'"
            fail=1
          elif [[ "$NORM_DOCKERFILE_PATH" == *[*?\[]* ]]; then
            echo "::error::dockerfile_path must not contain glob metacharacters (*, ?, [), got '$DOCKERFILE_PATH'"
            fail=1
          elif [[ -L "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path '$DOCKERFILE_PATH' must be a regular file, not a symlink"
            fail=1
          elif [[ ! -f "$NORM_DOCKERFILE_PATH" ]]; then
            echo "::error::dockerfile_path '$DOCKERFILE_PATH' not found in the caller repository workspace"
            fail=1
          fi

          if [[ -z "$NORM_EXTERNAL_PATH" || "$NORM_EXTERNAL_PATH" == "." ]]; then
            echo "::error::external_path must resolve to a directory under the workspace (not '.' / './' / empty), got '$EXTERNAL_PATH'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == /* ]]; then
            echo "::error::external_path must be relative, got '$EXTERNAL_PATH'"
            fail=1
          elif has_dotdot "$NORM_EXTERNAL_PATH"; then
            echo "::error::external_path must not contain a '..' path component, got '$EXTERNAL_PATH'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == */ ]]; then
            echo "::error::external_path must not end with '/', got '$EXTERNAL_PATH'"
            fail=1
          elif [[ "$NORM_EXTERNAL_PATH" == *[*?\[]* ]]; then
            echo "::error::external_path must not contain glob metacharacters (*, ?, [), got '$EXTERNAL_PATH'"
            fail=1
          else
            case "$NORM_CONTEXT" in
              "$NORM_EXTERNAL_PATH"|"$NORM_EXTERNAL_PATH"/*) ;;
              *)
                echo "::error::context must be '$EXTERNAL_PATH' or a subpath when external_repo is set, got '$CONTEXT'"
                fail=1
                ;;
            esac
          fi

          # context '..' and glob checks run independently of the external_path
          # branches above so the more specific error still fires when
          # external_path itself fails validation.
          if has_dotdot "$NORM_CONTEXT"; then
            echo "::error::context must not contain a '..' path component, got '$CONTEXT'"
            fail=1
          fi
          if [[ "$NORM_CONTEXT" == *[*?\[]* ]]; then
            echo "::error::context must not contain glob metacharacters (*, ?, [), got '$CONTEXT'"
            fail=1
          fi

          # Reject dockerfile_path that lives under external_path. The external
          # checkout step clones into external_path with clean=true, removing
          # the caller's Dockerfile before the overlay cp reads it. In the
          # degenerate case where the external repo ships a file at the same
          # relative path, cp would silently use the external repo's content
          # as the overlay source - defeating the whole point of the overlay.
          # Only runs when both paths passed their own non-emptiness checks.
          if [[ -n "$NORM_DOCKERFILE_PATH" && -n "$NORM_EXTERNAL_PATH" && "$NORM_EXTERNAL_PATH" != "." ]]; then
            case "$NORM_DOCKERFILE_PATH" in
              "$NORM_EXTERNAL_PATH"|"$NORM_EXTERNAL_PATH"/*)
                echo "::error::dockerfile_path ('$DOCKERFILE_PATH') must not be inside external_path ('$EXTERNAL_PATH'); the external checkout would overwrite it before the overlay copy"
                fail=1
                ;;
            esac
          fi

          if [[ "$GO_VENDOR" == "true" ]]; then
            echo "::error::go_vendor is not supported with external_repo; the vendor step would run in the caller repo, leaving the external build context without vendor/"
            fail=1
          fi
          [[ "$fail" -eq 0 ]] || exit 1

      # SECURITY (CodeQL actions/untrusted-checkout): this step checks out an
      # external repo whose code is then executed by `docker build`, inside a
      # job that holds registry secrets and write scopes. That is safe ONLY
      # because external_repo/external_ref are maintainer-pinned inputs,
      # validated above (bare 'owner/repo' slug, sane ref charset, optional
      # allowlist), and callers are contractually required never to wire
      # PR-event data into them. Do NOT call this reusable workflow from a
      # pull_request_target / workflow_run caller that forwards
      # github.event.pull_request.head.* into external_repo or external_ref.
      - name: Checkout external repo
        if: inputs.external_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.external_repo }}
          ref: ${{ inputs.external_ref }}
          path: ${{ inputs.external_path }}
          token: ${{ secrets.gh_pat || github.token }}

      - name: Overlay Dockerfile onto external source
        if: inputs.external_repo != ''
        env:
          SRC: ${{ inputs.dockerfile_path }}
          DEST: ${{ inputs.external_path }}/Dockerfile
        run: |
          # Remove any existing DEST first so cp cannot follow a symlink the
          # external repo may ship at that path. Tolerate rm's exit code with
          # `|| true` so the `[[ -e ]]` check below can fire with a clear
          # error message when DEST is a directory (rm -f fails on dirs, and
          # without the `|| true` the step would abort on the bare rm error
          # under `set -e`, never reaching this branch).
          rm -f -- "$DEST" || true
          if [[ -e "$DEST" || -L "$DEST" ]]; then
            echo "::error::cannot overlay Dockerfile onto '$DEST': path still exists after rm (likely a directory)"
            exit 1
          fi
          cp -- "$SRC" "$DEST"

      - name: Prepare non-secret build args from env file
        id: env-args
        if: inputs.env_file != ''
        env:
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          # IMPORTANT: The env file is used to populate both GITHUB_ENV and the
          # "build_args" output, which is intended to be passed to Docker build-args.
          # Docker build args are NOT secret-safe (they may appear in image metadata,
          # layers, or logs), so the env file MUST NOT contain secrets or credentials.
          #
          # Only export valid KEY=VALUE lines (shell-safe keys, skip invalid lines)
          DELIM="ENV_ARGS_EOF_${RANDOM}${RANDOM}"
          echo "build_args<<${DELIM}" >> "$GITHUB_OUTPUT"
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*) ]]; then
              echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
              echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            fi
          done < "$ENV_FILE"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Set up Go for vendoring
        if: inputs.go_vendor
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Configure private modules and vendor
        if: inputs.go_vendor
        env:
          HAS_GH_PAT: ${{ secrets.gh_pat != '' }}
          GH_PAT: ${{ secrets.gh_pat }}
        run: |
          if [[ "$HAS_GH_PAT" == "true" ]]; then
            git config --global url."https://${GH_PAT}@github.com/nics-dp".insteadOf "https://github.com/nics-dp"
          fi
          go env -w GOPRIVATE=github.com/nics-dp GONOPROXY=github.com/nics-dp GONOSUMDB=github.com/nics-dp
          go mod vendor
          if [[ "$HAS_GH_PAT" == "true" ]]; then
            git config --global --remove-section "url.https://${GH_PAT}@github.com/nics-dp" 2>/dev/null || true
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY_DH }}/${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short,enable=${{ inputs.snapshot }}
            type=sha,prefix=,format=long,enable=${{ inputs.snapshot }}
            type=semver,pattern=v{{version}},enable=${{ !inputs.snapshot }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !inputs.snapshot }}
            type=semver,pattern=v{{major}},enable=${{ !inputs.snapshot }}
            type=ref,event=branch,enable=${{ !inputs.snapshot }}
            type=ref,event=pr,enable=${{ !inputs.snapshot }}
          flavor: |
            latest=${{ !inputs.snapshot && 'auto' || 'false' }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          # In external_repo mode the overlaid Dockerfile lives at
          # external_path/Dockerfile, which may differ from context (e.g., when
          # caller points context at a monorepo subpath). Pin file explicitly
          # so build never silently picks up an upstream Dockerfile.
          #
          # When external_repo is not set, fall back to ${context}/Dockerfile.
          # This is the path build-push-action would currently infer on its
          # own, but setting it explicitly pins behaviour against future action
          # changes and keeps existing callers identical regardless of how the
          # action handles an empty `file:` input.
          file: ${{ inputs.external_repo != '' && format('{0}/Dockerfile', inputs.external_path) || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.build_args }}
            ${{ steps.env-args.outputs.build_args }}
          secrets: |
            github_token=${{ secrets.gh_pat || secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          sbom: ${{ inputs.sbom }}
          provenance: ${{ inputs.provenance && 'mode=max' || 'false' }}

      - name: Generate artifact attestation (DockerHub)
        if: inputs.attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: index.docker.io/${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (GHCR)
        if: inputs.attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (DockerHub)
        if: inputs.cosign
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "index.docker.io/${DH_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"

      - name: Sign image (GHCR)
        if: inputs.cosign
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_GHCR}/${GHCR_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
