# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Security SARIF

# Runs the security / IaC scanners that historically only GATED CI (no SARIF
# export) and uploads their findings to GitHub code scanning (Security > Code
# scanning), each under a distinct category. Scanners are informational by
# default; callers may opt into fail-closed gosec enforcement. Callers add a
# job that `uses:` this workflow.
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      go_version:
        required: false
        type: string
        default: ""
        description: >-
          Go toolchain for gosec/govulncheck. Empty (default) reads the caller's
          own go.mod so the scan matches what that repo builds with; a literal
          version overrides it. See the Set up Go step for why not "stable".
      scan_path:
        required: false
        type: string
        default: "."
        description: "Directory to scan (trivy config / semgrep root)"
      run_go:
        required: false
        type: boolean
        default: true
        description: "Master switch for Go scanners"
      run_gosec:
        required: false
        type: boolean
        default: true
        description: "Run gosec when the Go scanner master switch is enabled"
      run_govulncheck:
        required: false
        type: boolean
        default: true
        description: "Run govulncheck when the Go scanner master switch is enabled"
      gosec_blocking:
        required: false
        type: boolean
        default: false
        description: "Fail closed on gosec findings and operational failures"
      run_dockerfile:
        required: false
        type: boolean
        default: true
        description: "Run the Dockerfile scanners (hadolint + trivy config)"
      run_semgrep:
        required: false
        type: boolean
        default: true
        description: "Run the semgrep SAST scan"
      runs_on:
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}''). Defaults to the releasers 8-core group; the scanners (trivy/semgrep/gosec) are CPU-bound and benefit from it. Must stay Linux (Docker-based actions).'
        required: false
        type: string
        default: '{"group":"releasers"}'
    secrets:
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (paired with the CI_READ_APP_CLIENT_ID org variable). Used to mint a short-lived token for private Go module access (gosec/govulncheck must build github.com/nics-dp/libdcf)."

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-sarif:
    # runs_on must stay a Linux runner: this workflow depends on Linux/Docker-based
    # actions (hadolint-action, trivy-action) and bash scan steps, so it is not
    # portable to Windows/macOS. Defaults to the releasers 8-core group (the
    # scanners are CPU-bound); callers may override with '"ubuntu-latest"'.
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
      # required by github/codeql-action/upload-sarif to write code-scanning results
      security-events: write
      actions: read
    env:
      # secrets cannot be used in step-level if:, so bridge to env here. Mirrors
      # mise-task.yml: the ci-read App is identified by the CI_READ_APP_CLIENT_ID
      # org variable (client-id) plus the ci_read_app_private_key secret.
      HAS_CI_APP: ${{ vars.CI_READ_APP_CLIENT_ID != '' && secrets.ci_read_app_private_key != '' }}
      # Fixed derived predicates. run_go remains the master switch: child inputs
      # cannot re-enable a Go scanner when it is false.
      EFFECTIVE_GOSEC: ${{ inputs.run_go && inputs.run_gosec }}
      EFFECTIVE_GOVULNCHECK: ${{ inputs.run_go && inputs.run_govulncheck }}
      EFFECTIVE_ANY_GO: ${{ inputs.run_go && (inputs.run_gosec || inputs.run_govulncheck) }}
      EFFECTIVE_BLOCKING: ${{ inputs.run_go && inputs.run_gosec && inputs.gosec_blocking }}
      # Only these caller events may receive the ci-read App token. Reusable
      # workflows observe the caller's event name here.
      SUPPORTED_TOKEN_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      # Establish a blank job-local global Git config before checkout, setup-go,
      # token minting, or any third-party action. Keep the override set after
      # cleanup so later actions never fall back to runner-global configuration.
      - name: Initialize isolated Git configuration
        id: git-isolation
        shell: bash
        run: |
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "::error::RUNNER_TEMP must be an absolute Linux path"; exit 1 ;;
          esac
          case "$RUNNER_TEMP" in
            *$'\n'*|*$'\r'*) echo "::error::RUNNER_TEMP contains a newline"; exit 1 ;;
          esac
          gitconfig="${RUNNER_TEMP}/security-sarif-gitconfig"
          if [ -e "$gitconfig" ] || [ -L "$gitconfig" ]; then
            rm -f -- "$gitconfig"
          fi
          if [ -e "$gitconfig" ] || [ -L "$gitconfig" ]; then
            echo "::error::failed to remove stale isolated Git config"
            exit 1
          fi
          umask 077
          : > "$gitconfig"
          chmod 0600 "$gitconfig"
          if [ ! -f "$gitconfig" ] || [ -L "$gitconfig" ] || [ "$(stat -c '%a' "$gitconfig")" != "600" ]; then
            echo "::error::isolated Git config is not a regular mode-0600 file"
            exit 1
          fi
          {
            echo "GIT_CONFIG_GLOBAL=${gitconfig}"
            echo "GOBIN=${RUNNER_TEMP}/security-sarif-bin"
          } >> "$GITHUB_ENV"

      # Mint a nics-dp-ci-read App token only for explicitly supported caller
      # events and only when at least one Go scanner is effective.
      - name: Mint private-module token
        id: priv-token
        if: ${{ env.HAS_CI_APP == 'true' && env.EFFECTIVE_ANY_GO == 'true' && env.SUPPORTED_TOKEN_EVENT == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN into the checkout so later steps
          # cannot be coerced into using it (CodeQL actions/untrusted-checkout).
          # Private module access is granted separately via gh_pat below.
          persist-credentials: false

      # Pure fail-fast gate for the caller-supplied scan_path: reject an empty
      # value, absolute paths, any '..' segment, and any newline/CR. This runs
      # before every scanner (steps execute in order), so a path that escapes
      # the workspace fails the job here instead of letting a scanner read
      # out-of-tree files and leak their paths into the uploaded SARIF.
      #
      # The step ONLY validates -- it does not write the value to $GITHUB_ENV
      # or $GITHUB_OUTPUT, so there is no user-controlled environment-file write
      # (avoids CodeQL "env var from user-controlled source" / CRLF env-file
      # injection). Each shell scanner re-bridges inputs.scan_path through its
      # own per-step env var instead.
      #
      # Failing on a bad path does NOT break the non-blocking contract: an
      # out-of-workspace scan_path is a CALLER CONFIGURATION error and should be
      # surfaced loudly, which is distinct from a scanner FINDING (those never
      # fail the job). Mirrors the allowlist-then-fail input validation used by
      # the go:dev / go:run atoms.
      - name: Validate scan path
        env:
          RAW_SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          if [ -z "$RAW_SCAN_PATH" ]; then
            echo "::error::scan_path must not be empty (use '.' for the repo root)"
            exit 1
          fi
          case "$RAW_SCAN_PATH" in
            /*)
              echo "::error::scan_path must be workspace-relative, not absolute"
              exit 1
              ;;
          esac
          # Reject '..' only as a complete path segment (parent-dir traversal),
          # not a literal substring -- pad with leading/trailing '/' so '*/../*'
          # matches a real ".." segment while legitimate names like 'my..dir'
          # are allowed.
          case "/$RAW_SCAN_PATH/" in
            */../*)
              echo "::error::scan_path must not contain a '..' path segment"
              exit 1
              ;;
          esac
          # Reject newline / carriage-return (CRLF env-file / log-injection guard)
          # by comparing the value against itself with those bytes stripped.
          if [ "$(printf '%s' "$RAW_SCAN_PATH" | tr -d '\n\r')" != "$RAW_SCAN_PATH" ]; then
            echo "::error::scan_path must not contain newline or carriage-return characters"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Go scanners: gosec (SAST) + govulncheck (known vulns). Both must BUILD
      # the module, which imports the private github.com/nics-dp/libdcf, so we
      # set up Go and configure git to fetch private modules via the ci-read App
      # token minted above.
      # ----------------------------------------------------------------------
      # Empty go_version scans on the toolchain the caller's own go.mod declares.
      # The version file is the repository ROOT go.mod, never scan_path: that
      # input scopes only trivy config and semgrep, while the Go steps here all
      # run against the root module with no working-directory. An explicit
      # go_version still wins. Rationale: CLAUDE.md, nics-dp/meta#327.
      - name: Set up Go
        if: env.EFFECTIVE_ANY_GO == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          go-version-file: ${{ inputs.go_version == '' && 'go.mod' || '' }}
          cache: false

      - name: Configure git for private modules
        if: env.EFFECTIVE_ANY_GO == 'true'
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          gitconfig="${RUNNER_TEMP}/security-sarif-gitconfig"
          if [ "${GIT_CONFIG_GLOBAL:-}" != "$gitconfig" ] || [ ! -f "$gitconfig" ] || [ -L "$gitconfig" ]; then
            echo "::error::isolated Git configuration is unavailable"
            exit 1
          fi
          if [ -n "$GH_PAT" ]; then
            # Add only the approved HTTPS organization-prefix rewrite.
            git config --file "$gitconfig" \
              url."https://x-access-token:${GH_PAT}@github.com/nics-dp/".insteadOf "https://github.com/nics-dp/"
            {
              echo "GOPRIVATE=github.com/nics-dp"
              echo "GONOSUMDB=github.com/nics-dp"
            } >> "$GITHUB_ENV"
          elif [ "${HAS_CI_APP}" = "true" ] && [ "${SUPPORTED_TOKEN_EVENT}" != "true" ]; then
            echo "::warning::ci-read App token withheld on unsupported event ${GITHUB_EVENT_NAME}; gosec/govulncheck may be unable to fetch private modules."
          else
            echo "::warning::ci-read App token unavailable (pass ci_read_app_private_key and set CI_READ_APP_CLIENT_ID); gosec/govulncheck may be unable to fetch private modules."
          fi

      # Consumer repos may vendor (-mod=vendor). Refresh the vendor tree so
      # both Go scanners can type-check consistently. Preserve its outcome for
      # fail-closed enforcement without preventing cleanup or uploads.
      - name: Vendor Go modules
        id: vendor
        if: env.EFFECTIVE_ANY_GO == 'true'
        continue-on-error: true
        run: |
          if [ -d vendor ]; then
            go mod vendor
          fi

      - name: Run gosec (SARIF)
        id: gosec
        if: env.EFFECTIVE_GOSEC == 'true'
        continue-on-error: true
        run: |
          rm -f -- gosec.sarif
          if [ -e gosec.sarif ] || [ -L gosec.sarif ]; then
            echo "::error::failed to remove stale gosec SARIF artifact"
            exit 1
          fi
          echo "sarif_producer_initialized=true" >> "$GITHUB_OUTPUT"

          expected_gobin="${RUNNER_TEMP}/security-sarif-bin"
          if [ "${GOBIN:-}" != "$expected_gobin" ]; then
            echo "::error::GOBIN is not the workflow-owned scanner path"
            exit 1
          fi
          if [ -e "$GOBIN" ] || [ -L "$GOBIN" ]; then
            rm -rf -- "$GOBIN"
          fi
          if [ -e "$GOBIN" ] || [ -L "$GOBIN" ]; then
            echo "::error::failed to remove stale scanner GOBIN"
            exit 1
          fi
          umask 077
          mkdir -m 0700 -- "$GOBIN"
          if [ ! -d "$GOBIN" ] || [ -L "$GOBIN" ] || [ "$(stat -c '%a' "$GOBIN")" != "700" ]; then
            echo "::error::scanner GOBIN is not a regular mode-0700 directory"
            exit 1
          fi

          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec_bin="${GOBIN}/gosec"
          if [ ! -f "$gosec_bin" ] || [ -L "$gosec_bin" ] || [ ! -x "$gosec_bin" ]; then
            echo "::error::installed gosec is not a regular non-symlink executable"
            exit 1
          fi
          "$gosec_bin" -version
          if [ "$EFFECTIVE_BLOCKING" = "true" ]; then
            "$gosec_bin" -fmt sarif -out gosec.sarif ./...
          else
            "$gosec_bin" -fmt sarif -out gosec.sarif -no-fail ./...
          fi

      # This is a bounded structural precheck, not a claim of complete SARIF
      # validity. GitHub code scanning remains the authoritative processor.
      - name: Validate gosec SARIF structure
        id: gosec-sarif-structure
        if: ${{ always() && env.EFFECTIVE_GOSEC == 'true' && steps.gosec.outputs.sarif_producer_initialized == 'true' && (steps.gosec.outcome == 'success' || steps.gosec.outcome == 'failure') }}
        continue-on-error: true
        run: |
          if [ ! -s gosec.sarif ] || [ ! -f gosec.sarif ] || [ -L gosec.sarif ]; then
            echo "::error::gosec.sarif must be a non-empty regular non-symlink file"
            exit 1
          fi
          jq -e '
            type == "object" and
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0) and
            all(.runs[];
              (.tool.driver.name | type == "string") and
              ((has("results") | not) or (.results | type == "array")) and
              all(.results[]?; type == "object")
            )
          ' gosec.sarif >/dev/null

      - name: Run govulncheck (SARIF)
        id: govulncheck
        if: env.EFFECTIVE_GOVULNCHECK == 'true'
        continue-on-error: true
        run: |
          rm -f -- govulncheck.sarif
          if [ -e govulncheck.sarif ] || [ -L govulncheck.sarif ]; then
            echo "::error::failed to remove stale govulncheck SARIF artifact"
            exit 1
          fi
          echo "sarif_producer_initialized=true" >> "$GITHUB_OUTPUT"

          expected_gobin="${RUNNER_TEMP}/security-sarif-bin"
          if [ "${GOBIN:-}" != "$expected_gobin" ]; then
            echo "::error::GOBIN is not the workflow-owned scanner path"
            exit 1
          fi
          if [ ! -e "$GOBIN" ] && [ ! -L "$GOBIN" ]; then
            umask 077
            mkdir -m 0700 -- "$GOBIN"
          fi
          if [ ! -d "$GOBIN" ] || [ -L "$GOBIN" ] || [ "$(stat -c '%a' "$GOBIN")" != "700" ]; then
            echo "::error::scanner GOBIN is not a regular mode-0700 directory"
            exit 1
          fi

          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck_bin="${GOBIN}/govulncheck"
          if [ ! -f "$govulncheck_bin" ] || [ -L "$govulncheck_bin" ] || [ ! -x "$govulncheck_bin" ]; then
            echo "::error::installed govulncheck is not a regular non-symlink executable"
            exit 1
          fi
          # SARIF mode reports findings without a failing exit. Keep the
          # historical operational-error guard and fail-safe filter semantics.
          "$govulncheck_bin" -format sarif ./... > govulncheck.sarif || true
          # Drop GO-2026-5932 only at note level. A warning/error remains visible.
          python3 - <<'FILTER_PY'
          import json, os
          SRC = "govulncheck.sarif"
          IGNORE = {"GO-2026-5932"}
          try:
              with open(SRC, encoding="utf-8") as fh:
                  data = json.load(fh)
              def resolved_id(r, rules):
                  rid = r.get("ruleId")
                  if rid:
                      return rid
                  idx = r.get("ruleIndex")
                  if not isinstance(idx, int) or idx < 0:
                      idx = (r.get("rule") or {}).get("index")
                  if isinstance(idx, int) and 0 <= idx < len(rules):
                      return rules[idx].get("id")
                  return None
              def drop(r, rules):
                  return resolved_id(r, rules) in IGNORE and r.get("level") == "note"
              removed = 0
              for run in data.get("runs", []):
                  rules = ((run.get("tool") or {}).get("driver") or {}).get("rules", []) or []
                  before = run.get("results", []) or []
                  after = [r for r in before if not drop(r, rules)]
                  removed += len(before) - len(after)
                  run["results"] = after
              tmp = SRC + ".tmp"
              with open(tmp, "w", encoding="utf-8") as fh:
                  json.dump(data, fh)
              os.replace(tmp, SRC)
              print(f"govulncheck-filter: removed {removed} note-level result(s) for {sorted(IGNORE)}")
          except Exception as e:
              print(f"govulncheck-filter: skipped ({e}); original SARIF kept")
          FILTER_PY

      # All Go scans finish before credentials and scanner binaries are removed.
      # The fixed GIT_CONFIG_GLOBAL override deliberately remains set to an
      # absent file, preventing fallback to any runner-global configuration.
      - name: Remove private Go scan state
        id: go-private-cleanup
        if: always()
        continue-on-error: true
        run: |
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "::error::RUNNER_TEMP must be an absolute Linux path"; exit 1 ;;
          esac
          gitconfig="${RUNNER_TEMP}/security-sarif-gitconfig"
          scanner_gobin="${RUNNER_TEMP}/security-sarif-bin"
          failed=0
          if [ "${GIT_CONFIG_GLOBAL:-}" != "$gitconfig" ] || [ "${GOBIN:-}" != "$scanner_gobin" ]; then
            echo "::error::workflow-owned cleanup overrides do not match"
            failed=1
          fi
          if ! rm -f -- "$gitconfig"; then
            failed=1
          fi
          if ! rm -rf -- "$scanner_gobin"; then
            failed=1
          fi
          if [ -e "$gitconfig" ] || [ -L "$gitconfig" ] || [ -e "$scanner_gobin" ] || [ -L "$scanner_gobin" ]; then
            echo "::error::private Go scan state remains after cleanup"
            failed=1
          fi
          exit "$failed"

      - name: Upload gosec SARIF
        id: gosec-upload
        if: ${{ always() && env.EFFECTIVE_GOSEC == 'true' && steps.gosec-sarif-structure.outcome == 'success' && steps.go-private-cleanup.outcome == 'success' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec.sarif
          category: gosec
          # In blocking mode the pinned action waits and throws on terminal
          # processing_status=failed. Its polling API-error and max-tries paths
          # only warn, so those cases remain best-effort rather than processed.
          wait-for-processing: ${{ env.EFFECTIVE_BLOCKING == 'true' }}

      - name: Upload govulncheck SARIF
        id: govulncheck-upload
        if: ${{ always() && env.EFFECTIVE_GOVULNCHECK == 'true' && steps.govulncheck.outputs.sarif_producer_initialized == 'true' && (steps.govulncheck.outcome == 'success' || steps.govulncheck.outcome == 'failure') && steps.go-private-cleanup.outcome == 'success' && hashFiles('govulncheck.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Remove gosec SARIF artifact
        id: gosec-sarif-cleanup
        if: ${{ always() && env.EFFECTIVE_GOSEC == 'true' && steps.gosec.outputs.sarif_producer_initialized == 'true' }}
        continue-on-error: true
        run: |
          failed=0
          if ! rm -f -- gosec.sarif; then
            failed=1
          fi
          if [ -e gosec.sarif ] || [ -L gosec.sarif ]; then
            echo "::error::gosec SARIF artifact remains after cleanup"
            failed=1
          fi
          exit "$failed"

      - name: Remove govulncheck SARIF artifact
        id: govulncheck-sarif-cleanup
        if: ${{ always() && env.EFFECTIVE_GOVULNCHECK == 'true' && steps.govulncheck.outputs.sarif_producer_initialized == 'true' }}
        continue-on-error: true
        run: |
          failed=0
          if ! rm -f -- govulncheck.sarif; then
            failed=1
          fi
          if [ -e govulncheck.sarif ] || [ -L govulncheck.sarif ]; then
            echo "::error::govulncheck SARIF artifact remains after cleanup"
            failed=1
          fi
          exit "$failed"

      # ----------------------------------------------------------------------
      # semgrep (SAST). Mirrors .mise/tasks/ci/semgrep config selection
      # (p/ci baseline + go/python/typescript/javascript lang packs), minus
      # --error so findings never fail the job.
      # ----------------------------------------------------------------------
      - name: Run semgrep (SARIF)
        if: inputs.run_semgrep
        continue-on-error: true
        env:
          # Per-step env bridge: keep inputs.scan_path out of the shell command
          # text (no ${{ }} interpolation -> no shell injection); the value was
          # already gated by "Validate scan path" above. Quoted + passed after
          # `--` so a leading dash is never parsed as a semgrep option.
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          # pipx is preinstalled on GitHub-hosted runners and gives an isolated
          # install (avoids PEP 668 externally-managed-environment failures),
          # matching the pipx:semgrep tool used by the ci:semgrep mise task.
          # --force reinstalls cleanly when a reused runner already has semgrep,
          # instead of erroring out and silently skipping the scan.
          pipx install --force semgrep
          # --enable-nosem honours in-repo `nosem` suppression comments, mirroring
          # .mise/tasks/ci/semgrep (this differs only by dropping --error so
          # findings populate the Security tab without failing the job).
          semgrep scan \
            --enable-nosem \
            --config p/ci \
            --config p/golang \
            --config p/python \
            --config p/typescript \
            --config p/javascript \
            --sarif --output semgrep.sarif \
            -- "$SCAN_PATH"

      - name: Upload semgrep SARIF
        if: always() && inputs.run_semgrep && hashFiles('semgrep.sarif') != ''
        # non-blocking: a failed upload must not fail the job (see gosec upload).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ----------------------------------------------------------------------
      # IaC / Dockerfile scanners: trivy config (misconfig) + hadolint (lint).
      # ----------------------------------------------------------------------
      - name: Run trivy config (SARIF)
        if: inputs.run_dockerfile
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          # trivy-action is a third-party action with no shell we control, so the
          # value goes straight into its `scan-ref` input. Path safety is enforced
          # by the earlier "Validate scan path" gate, which fails the job before
          # this step for any absolute / '..' / newline path.
          scan-ref: ${{ inputs.scan_path }}
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload trivy config SARIF
        if: always() && inputs.run_dockerfile && hashFiles('trivy-config.sarif') != ''
        # non-blocking: a failed upload must not fail the job (see gosec upload).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Run hadolint (SARIF)
        if: inputs.run_dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload hadolint SARIF
        if: always() && inputs.run_dockerfile && hashFiles('hadolint.sarif') != ''
        # non-blocking: a failed upload must not fail the job (see gosec upload).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Enforce blocking gosec result
        id: gosec-enforce
        if: always() && env.EFFECTIVE_BLOCKING == 'true'
        env:
          VENDOR_OUTCOME: ${{ steps.vendor.outcome }}
          GOSEC_OUTCOME: ${{ steps.gosec.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.gosec-sarif-structure.outcome }}
          PRIVATE_CLEANUP_OUTCOME: ${{ steps.go-private-cleanup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.gosec-upload.outcome }}
          ARTIFACT_CLEANUP_OUTCOME: ${{ steps.gosec-sarif-cleanup.outcome }}
        run: |
          failed=0
          for outcome in \
            "$VENDOR_OUTCOME" \
            "$GOSEC_OUTCOME" \
            "$STRUCTURE_OUTCOME" \
            "$PRIVATE_CLEANUP_OUTCOME" \
            "$UPLOAD_OUTCOME" \
            "$ARTIFACT_CLEANUP_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::blocking gosec failed closed; inspect preserved step outcomes"
            exit 1
          fi
