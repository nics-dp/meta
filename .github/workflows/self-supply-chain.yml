# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: self-supply-chain

# meta self-consumes its own PRIVATE Scorecard reusable (scorecard.yml,
# publish_results: false), so its code scanning goes through the same SARIF
# posture-noise filter as every other repo. No public OpenSSF API publish.
# No dependency-submission: meta has no compiled-language manifests (config only).
on:
  push:
    branches: [dev]
  schedule:
    - cron: "39 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: nics-dp/meta/.github/workflows/scorecard.yml@main
    with:
      publish: false
    secrets:
      scorecard_app_private_key: ${{ secrets.SCORECARD_APP_PRIVATE_KEY }}
