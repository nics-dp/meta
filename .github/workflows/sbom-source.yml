# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: SBOM Source

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name for artifact naming (e.g., dcf-platform)"
      scan_path:
        required: false
        type: string
        default: "."
        description: "Directory to scan"
      ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (defaults to event ref)"
      snapshot:
        required: false
        type: boolean
        default: false
        description: "Snapshot mode (skip release upload)"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner as JSON (e.g., ''"ubuntu-latest"'' or ''{"group":"releasers"}'')'
    secrets:
      ci_read_app_private_key:
        required: false
        description: "Private key of the nics-dp-ci-read GitHub App (paired with the CI_READ_APP_CLIENT_ID org variable)."

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sbom-source:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      actions: read
      contents: write
      security-events: write
    env:
      # secrets cannot be used in step-level if:, so bridge to env here.
      HAS_CI_APP: ${{ vars.CI_READ_APP_CLIENT_ID != '' && secrets.ci_read_app_private_key != '' }}
    steps:
      # Mint a nics-dp-ci-read App token for private module access. The client-id comes
      # from the CI_READ_APP_CLIENT_ID org variable; when the private key is absent the git-config below is a no-op.
      - name: Setup | Mint private-module token
        id: priv-token
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ci_read_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          # The ref is a workflow_call input and may be attacker-influenced;
          # do not persist the GITHUB_TOKEN. Private module access is granted
          # separately via the App token (CodeQL actions/untrusted-checkout).
          persist-credentials: false

      - name: Configure git for private modules
        env:
          GH_PAT: ${{ steps.priv-token.outputs.token }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Compute version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [[ "$SNAPSHOT" == "true" ]]; then
            echo "version=0.0.0-snapshot+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate source SBOM (CycloneDX JSON 1.6)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ inputs.scan_path }}
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          upload-artifact: false
          dependency-snapshot: ${{ !inputs.snapshot }}

      - name: Set up Go (for tooling)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Enrich SBOM with parlay
        run: |
          go install github.com/snyk/parlay@v0.11.0
          parlay ecosystems enrich sbom-source.cdx.json > enriched-source.cdx.json

      - name: Scan SBOM with Trivy (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: enriched-source.cdx.json
          format: sarif
          output: trivy-source.sarif

      - name: Fix Trivy SARIF empty artifact locations
        run: |
          jq '(.runs[].results[].locations[].physicalLocation.artifactLocation | select(.uri == "")) .uri = "sbom-source.cdx.json"' \
            trivy-source.sarif > trivy-source-fixed.sarif
          mv trivy-source-fixed.sarif trivy-source.sarif

      - name: Drop non-actionable openpgp advisory from Trivy SARIF
        run: |
          # Drop GO-2026-5932 (golang.org/x/crypto/openpgp, unmaintained, no fixed
          # version) before upload, mirroring the govulncheck filter in
          # security-sarif.yml and the trivy-image scan. The advisory is
          # non-actionable (transitively-present openpgp subpackage, symbols never
          # called, no fixed version); Trivy SARIF carries no reachability level,
          # so this drops by rule id unconditionally. The full unfixed set still
          # ships in the Trivy JSON asset on release runs (snapshot runs upload
          # no assets). Fail-safe: on any jq error the original SARIF is kept
          # and still uploaded.
          if jq '.runs[].results |= map(select(.ruleId != "GO-2026-5932"))' \
               trivy-source.sarif > trivy-source-filtered.sarif; then
            mv trivy-source-filtered.sarif trivy-source.sarif
          else
            echo "::warning::trivy-filter skipped (jq error); original SARIF kept"
            rm -f trivy-source-filtered.sarif
          fi

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

      - name: Scan SBOM with Trivy (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: enriched-source.cdx.json
          format: json
          output: trivy-source.json

      - name: Scan SBOM with Grype (SARIF)
        if: always()
        id: grype-sarif
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom-source.cdx.json
          output-format: sarif
          severity-cutoff: high
          # Gate only on vulnerabilities with an available fix; deps with no
          # upstream fix (not-fixed/wont-fix) are unactionable and would
          # otherwise block every release. Full unfixed set stays visible via
          # the Trivy SARIF upload.
          only-fixed: true

      - name: Upload Grype SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: grype-source

      - name: Scan SBOM with Grype (JSON)
        id: grype-json
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom-source.cdx.json
          output-format: json
          severity-cutoff: high
          only-fixed: true

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
          GRYPE_JSON: ${{ steps.grype-json.outputs.json }}
        run: |
          mv enriched-source.cdx.json "${PROJECT_NAME}_${VERSION}_source.cdx.json"
          mv trivy-source.json "${PROJECT_NAME}_${VERSION}_source.trivy.json"
          mv "$GRYPE_JSON" "${PROJECT_NAME}_${VERSION}_source.grype.json"

      - name: Upload to GitHub Release
        if: ${{ !inputs.snapshot }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          gh release upload "$VERSION_TAG" \
            "${PROJECT_NAME}_${VERSION}_source.cdx.json" \
            "${PROJECT_NAME}_${VERSION}_source.trivy.json" \
            "${PROJECT_NAME}_${VERSION}_source.grype.json" \
            --clobber
