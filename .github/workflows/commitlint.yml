# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Commitlint

on:
  workflow_call:

env:
  META_CONFIG_BASE: https://raw.githubusercontent.com/nics-dp/meta/main/configs

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch shared .commitlintrc.yml from meta@main
        run: |
          curl -fsSL "$META_CONFIG_BASE/.commitlintrc.yml" -o .commitlintrc.yml

      - name: Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml
