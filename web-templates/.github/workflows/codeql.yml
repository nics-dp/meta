# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# CodeQL workflow 模板 (Web 專案)
# Thin wrapper of nics-dp/meta codeql-reusable.yml
#
# 使用方式: 複製到新 repo 的 .github/workflows/codeql.yml
# 一般 Web repo 使用 javascript-typescript 即可；如需多語言，於 matrix-include
# 加入 (e.g. python)。actions language 僅 dev-cluster / patroni 啟用。

name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  schedule:
    - cron: "0 0 * * 1" # Every Monday 08:00 on UTC+8
  workflow_dispatch:

jobs:
  analyze:
    uses: nics-dp/meta/.github/workflows/codeql-reusable.yml@main
    with:
      matrix-include: '[{"language":"javascript-typescript","build-mode":"none"}]'
    secrets:
      GH_PAT_READ_NICSDP: ${{ secrets.GH_PAT_READ_NICSDP }}
